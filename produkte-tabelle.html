<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Produkttabelle — Root Index</title><base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Produkttabelle (I41, 29.09.2026): alle Produkte live aus der Datenbank – Index, Achsen, Nährwerte, Zusatzstoffe, Zutaten, Herstellerabgleich. Nur lesen. */
*{box-sizing:border-box}
:root{--bg:#1a1714;--card:#242019;--card2:#2c2720;--ink:#f4efe6;--ink2:#bdb3a3;--ink3:#7f776b;--line:rgba(255,255,255,.08);--acc:#e6a15a;--g:#7fd99a;--y:#f2cd6c;--r:#f2716c;--b:#8fb8f2}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 "IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--acc);text-decoration:none}
.bar{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 8px 0 0;color:var(--ink2);font-weight:600}
.bar input,.bar select,.bar button{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit}
.bar input[type=search]{width:240px}
.bar button{cursor:pointer}.bar button:hover{border-color:var(--acc)}
.nav{margin-left:auto;display:flex;gap:10px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.chip{border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--ink2);cursor:pointer;background:transparent;font:inherit;font-size:12px}
.chip b{color:var(--ink);font-weight:600;margin-left:4px}
.chip.an{border-color:var(--acc);color:var(--acc)}
#hinweis{padding:8px 16px;color:var(--r)}
.info{padding:6px 16px;color:var(--ink3);font-size:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.info button{background:transparent;border:1px solid var(--line);color:var(--ink2);border-radius:6px;padding:3px 9px;cursor:pointer;font:inherit}
.box{overflow:auto;height:calc(100vh - 150px);border-top:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;min-width:2300px;width:100%}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 8px;vertical-align:top;white-space:nowrap}
thead th{position:sticky;background:var(--card2);color:var(--ink2);font-weight:600;font-size:11.5px;text-align:left;z-index:3}
thead tr.g th{top:0;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;color:var(--ink3);text-align:center}
thead tr.k th{top:25px;cursor:pointer;user-select:none}
thead tr.k th.s::after{content:" ↕";color:var(--ink3)}
thead tr.k th.auf::after{content:" ▲";color:var(--acc)}
thead tr.k th.ab::after{content:" ▼";color:var(--acc)}
td.fix,th.fix{position:sticky;left:0;background:var(--card);z-index:2}
thead th.fix{z-index:4;background:var(--card2)}
td.fix2,th.fix2{position:sticky;left:74px;background:var(--card);z-index:2;max-width:260px;overflow:hidden;text-overflow:ellipsis}
thead th.fix2{z-index:4;background:var(--card2)}
tbody tr:hover td{background:#302a22}
td.n{text-align:right}
td.lang{white-space:normal;min-width:360px;max-width:520px;color:var(--ink2)}
td.lang.zu{max-height:3.2em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
tr.offen td.lang{-webkit-line-clamp:unset;display:table-cell}
.idx{display:inline-block;min-width:30px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:600;color:#1a1714}
.st{font-size:11px;border-radius:99px;padding:1px 8px;border:1px solid var(--line)}
.st.verifiziert,.st.korrigiert{color:var(--g);border-color:var(--g)}
.st.abweichend,.st.vorlegen{color:var(--r);border-color:var(--r)}
.st.offen{color:var(--y);border-color:var(--y)}
.st.nicht_lesbar,.st.keine_seite{color:var(--ink3)}
.st.ungeprueft{color:var(--ink3);border-style:dashed}
.leer{color:var(--ink3)}
@media (max-width:700px){.bar input[type=search]{width:100%}}
</style></head>
<body>
<div class="bar">
  <h1>Produkttabelle</h1>
  <input id="suche" type="search" placeholder="Suche: Name, Marke, EAN, P-Nummer" autocomplete="off">
  <input id="marke" type="text" placeholder="Marke beginnt mit …" style="width:150px">
  <select id="status"><option value="">Status: alle</option><option>Aktiv</option><option>Entwurf</option><option>prüfen</option><option>Aktiv ohne Index</option><option>Abgelehnt</option><option>Inaktiv</option></select>
  <select id="markt"><option value="">Markt: alle</option><option>DE</option><option>UK</option><option>FR</option><option>IE</option><option>US</option></select>
  <select id="proseite"><option>50</option><option selected>100</option><option>250</option><option>500</option></select>
  <button onclick="neu()">Suchen</button>
  <div class="nav"><a href="cockpit.html">Cockpit</a><a href="admin.html">Admin</a><a href="steuerung.html">Steuerung</a></div>
</div>
<div class="chips" id="chips"></div>
<div id="hinweis"></div>
<div class="info"><span id="zahl">lädt …</span>
  <button onclick="blatt(-1)">‹ zurück</button><span id="seite"></span><button onclick="blatt(1)">weiter ›</button>
  <button onclick="csv()" title="Alle Treffer des aktuellen Filters als CSV (Excel), max. 5.000 Zeilen">Als Excel (CSV)</button>
  <span>Klick auf eine Zeile zeigt die ganze Zutatenliste. Daten kommen live aus der Datenbank.</span></div>
<div class="box"><table>
<thead>
<tr class="g"><th class="fix" colspan="1"></th><th class="fix2"></th><th colspan="6">Produkt</th><th colspan="6">Index</th><th colspan="8">Nährwerte je 100 g/ml</th><th colspan="2">Zusatzstoffe</th><th>Zutaten</th><th colspan="2">Herstellerabgleich</th></tr>
<tr class="k" id="kopf"></tr>
</thead><tbody id="rumpf"></tbody></table></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://haurbpfkfaaehorirzee.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhdXJicGZrZmFhZWhvcmlyemVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDY2OTYsImV4cCI6MjA5Nzk4MjY5Nn0.6U0bD0m2kYM2iL0KJ9fbCFvcQMXAglr8GvwmPwyHqyw";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storage: window.localStorage, storageKey:"sb-cleanbase-auth" }
});
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const zahl = (x, st=1) => x==null||x==='' ? '<span class="leer">–</span>' : Number(x).toLocaleString('de-DE',{maximumFractionDigits:st});
const datum = t => t ? new Date(t).toLocaleDateString('de-DE') : '';

// Spalten: [Schlüssel, Überschrift, Sortierschlüssel oder null, Zelle]
const SP = [
  ['id','ID','id', r=>esc(r.id),'fix'],
  ['name','Name','name', r=>esc(r.name),'fix2'],
  ['marke','Marke','marke', r=>esc(r.marke)],
  ['ean','EAN',null, r=>esc(r.ean)],
  ['status','Status','status', r=>esc(r.status)],
  ['markt','Markt',null, r=>esc(r.markt)],
  ['menge','Menge',null, r=>esc(r.menge)],
  ['quelle','Quelle',null, r=>esc(r.quelle)],
  ['idx','Index','index', r=> r.idx==null?'<span class="leer">–</span>':'<span class="idx" style="background:'+farbe(r.idx)+'">'+r.idx+'</span>','n'],
  ['bew','Bewertung',null, r=>esc(r.bew)],
  ['a_zut','Zutaten',null, r=>zahl(r.a_zut),'n'],
  ['a_zus','Zusatzst.',null, r=>zahl(r.a_zus),'n'],
  ['a_nw','Nährwert',null, r=>zahl(r.a_nw),'n'],
  ['nova','NOVA',null, r=>zahl(r.nova),'n'],
  ['kcal','kcal','kcal', r=>zahl(r.kcal,0),'n'],
  ['fett','Fett',null, r=>zahl(r.fett),'n'],
  ['gesf','ges. F.',null, r=>zahl(r.gesf),'n'],
  ['kh','KH',null, r=>zahl(r.kh),'n'],
  ['zucker','Zucker',null, r=>zahl(r.zucker),'n'],
  ['bst','Ballastst.',null, r=>zahl(r.bst),'n'],
  ['prot','Eiweiß',null, r=>zahl(r.prot),'n'],
  ['salz','Salz',null, r=>zahl(r.salz,2),'n'],
  ['zus_status','Status',null, r=>esc(r.zus_status)],
  ['zus_text','Stoffe',null, r=>esc(r.zus_text)],
  ['zutaten','Zutatenliste',null, r=>esc(r.zutaten),'lang zu'],
  ['hersteller','Stand','hersteller', r=>'<span class="st '+esc(r.hersteller)+'">'+esc(TXT[r.hersteller]||r.hersteller)+'</span>'],
  ['hersteller_url','Seite / geprüft',null, r=> r.hersteller_url ? '<a href="'+esc(r.hersteller_url)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">öffnen</a> '+datum(r.hersteller_am) : ''],
];
const TXT = {verifiziert:'verifiziert',korrigiert:'korrigiert',abweichend:'abweichend',offen:'in Arbeit',vorlegen:'Ralph vorlegen',nicht_lesbar:'nicht lesbar',keine_seite:'keine Seite',ungeprueft:'ungeprüft',sonstiges:'sonstiges'};
function farbe(i){ return i>=70?'#7fd99a':i>=50?'#f2cd6c':'#f2716c'; }

let sort='id', ab=false, offset=0, gesamt=0, hstand='', ZEILEN=[];
$('kopf').innerHTML = SP.map(s=>'<th class="'+(s[4]||'').replace('lang zu','')+(s[2]?' s':'')+'" data-k="'+(s[2]||'')+'">'+s[1]+'</th>').join('');
$('kopf').querySelectorAll('th').forEach(th=>{ const k=th.dataset.k; if(!k) return; th.onclick=()=>{ if(sort===k) ab=!ab; else { sort=k; ab=(k==='index'||k==='kcal'); } offset=0; laden(); }; });
['suche','marke'].forEach(id=>$(id).addEventListener('keydown',e=>{ if(e.key==='Enter') neu(); }));
['status','markt','proseite'].forEach(id=>$(id).addEventListener('change',neu));

function filter(){ return { p_suche:$('suche').value||null, p_marke:$('marke').value||null, p_status:$('status').value||null, p_hersteller:hstand||null, p_markt:$('markt').value||null, p_sort:sort, p_ab:ab }; }
function neu(){ offset=0; laden(); }
function blatt(d){ const n=Number($('proseite').value); const o=offset+d*n; if(o<0||o>=gesamt) return; offset=o; laden(); }

async function laden(){
  $('zahl').textContent='lädt …';
  const n=Number($('proseite').value);
  const {data,error}=await client.rpc('cb_admin_produkt_tabelle',{...filter(), p_limit:n, p_offset:offset});
  if(error){ $('zahl').textContent='Fehler'; $('hinweis').innerHTML='Kein Zugriff: '+esc(error.message)+' – <a href="admin.html">im Admin anmelden</a>, dann hier neu laden.'; return; }
  $('hinweis').textContent='';
  gesamt=Number(data.gesamt||0); ZEILEN=data.zeilen||[];
  $('zahl').textContent=gesamt.toLocaleString('de-DE')+' Produkte';
  $('seite').textContent=(gesamt? (offset+1)+'–'+Math.min(offset+n,gesamt) : '0')+' von '+gesamt.toLocaleString('de-DE');
  $('kopf').querySelectorAll('th').forEach(th=>{ th.classList.remove('auf','ab'); if(th.dataset.k===sort) th.classList.add(ab?'ab':'auf'); });
  $('rumpf').innerHTML = ZEILEN.map((r,i)=>'<tr data-i="'+i+'">'+SP.map(s=>'<td class="'+(s[4]||'')+'">'+s[3](r)+'</td>').join('')+'</tr>').join('');
  $('rumpf').querySelectorAll('tr').forEach(tr=>tr.onclick=()=>tr.classList.toggle('offen'));
}

async function stand(){
  const {data,error}=await client.rpc('cb_admin_hersteller_stand_zahlen');
  if(error||!data) return;
  const reihe=['verifiziert','korrigiert','abweichend','offen','vorlegen','nicht_lesbar','keine_seite'];
  $('chips').innerHTML = '<span style="color:var(--ink3);font-size:12px;align-self:center">Herstellerabgleich:</span>'
    + '<button class="chip'+(hstand===''?' an':'')+'" data-s="">alle</button>'
    + reihe.map(k=>'<button class="chip'+(hstand===k?' an':'')+'" data-s="'+k+'">'+TXT[k]+'<b>'+Number(data[k]||0).toLocaleString('de-DE')+'</b></button>').join('')
    + '<button class="chip'+(hstand==='ungeprueft'?' an':'')+'" data-s="ungeprueft">ungeprüft</button>';
  $('chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ hstand=c.dataset.s; stand(); neu(); });
}

async function csv(){
  const alle=[]; const n=500;
  for(let o=0;o<Math.min(gesamt,5000);o+=n){
    $('zahl').textContent='Export … '+o;
    const {data,error}=await client.rpc('cb_admin_produkt_tabelle',{...filter(), p_limit:n, p_offset:o});
    if(error){ alert(error.message); return; }
    alle.push(...(data.zeilen||[]));
  }
  const kopf=SP.map(s=>s[1]); const keys=SP.map(s=>s[0]);
  const zelle=v=>{ if(v==null) return ''; const t=typeof v==='number'? String(v).replace('.',',') : String(v); return /[;"\n]/.test(t)? '"'+t.replace(/"/g,'""')+'"' : t; };
  const text='﻿'+[kopf.join(';'),...alle.map(r=>keys.map(k=>zelle(r[k])).join(';'))].join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));
  a.download='root-index-produkte-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  $('zahl').textContent=gesamt.toLocaleString('de-DE')+' Produkte';
}

stand(); laden();
</script>
</body></html>
