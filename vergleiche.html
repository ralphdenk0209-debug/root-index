     Alte Fassung (Kartenplanung mit Bildrechten/Upload): Git-Verlauf vor Commit

<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vergleiche · Root Index</title>
<style>
  body{ margin:0; font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif; color:#2a2640; background:#f2f0f8; }
  h1{ font-size:18px; margin:0; padding:14px 18px; background:#16233d; color:#fff; }
  .wrap{ max-width:1300px; margin:0 auto; padding:14px 18px 60px; }
  table{ width:100%; border-collapse:collapse; background:#fff; border:1px solid #dcd8ea; border-radius:10px; overflow:hidden; }
  th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:#6b6592; background:#f8f7fc; border-bottom:1px solid #dcd8ea; padding:8px; }
  td{ border-bottom:1px solid #eeecf6; padding:8px; vertical-align:top; }
  td.z{ text-align:right; font-weight:700; white-space:nowrap; }
  small{ color:#6b6592; }
  .st{ display:inline-block; border-radius:12px; padding:1px 9px; font-size:12px; font-weight:600; white-space:nowrap; }
  .fertig{ background:#e6f4ea; color:#1d6b3a; } .meta{ background:#1d8a4a; color:#fff; }
  tr.geplant td{ background:#eaf7ef; } .wartet{ background:#fdf3d7; color:#7a5406; } .geplant{ background:#eceaf3; color:#6b6592; }
  #msg{ color:#6b6592; font-size:12.5px; margin:8px 0; }
  td.akt{ white-space:nowrap; }
  td.akt button{ border:1px solid #dcd8ea; background:#fff; border-radius:6px; padding:2px 7px; margin-right:3px; cursor:pointer; font-size:13px; color:#2a2640; }
  td.akt button:hover{ background:#f2f0f8; }
  td.akt button.del{ color:#a3261d; border-color:#f0c9c5; }
  td.akt button:disabled{ opacity:.3; cursor:default; }
</style>
</head>
<body>
<h1>Vergleiche · Instagram &amp; Facebook</h1>
<div class="wrap">
  <div id="msg">lädt …</div>
  <table>
    <thead><tr>
      <th>Nr</th><th>Vergleich</th><th>Produkt A</th><th>Pkt</th><th>Produkt B</th><th>Pkt</th><th>Diff</th><th>Status</th><th>Was fehlt</th><th></th>
    </tr></thead>
    <tbody id="body"></tbody>
  </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Dieselben Zugangsdaten und derselbe storageKey wie app.js - die Admin-Anmeldung gilt hier mit. */
var vg = supabase.createClient("https://haurbpfkfaaehorirzee.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhdXJicGZrZmFhZWhvcmlyemVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDY2OTYsImV4cCI6MjA5Nzk4MjY5Nn0.6U0bD0m2kYM2iL0KJ9fbCFvcQMXAglr8GvwmPwyHqyw",
  { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storage:window.localStorage, storageKey:"sb-cleanbase-auth" },
    /* 02.10.: nie aus dem Browser-Cache lesen - sonst zeigt die Tabelle nach Loeschen/Verschieben den alten Stand */
    global:{ fetch:function(u, o){ return fetch(u, Object.assign({}, o, { cache:"no-store" })); } } });

function e(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
var STATUS = { "Bereit":["fertig","fertig"], "Veröffentlicht":["fertig","online"], "In Arbeit":["wartet","wartet"], "Idee":["geplant","geplant"], "Geplant":["geplant","geplant"] };

async function laden(){
  var r = await vg.from("Instagram_Vergleich").select("*").neq("Status","Verworfen").order("Nr",{ascending:true,nullsFirst:false});
  if(r.error){ document.getElementById("msg").textContent = "Fehler: " + r.error.message + " (im Admin angemeldet?)"; return; }
  var rows = r.data || [], ids = [];
  ZEILEN = rows;
  rows.forEach(function(x){ if(x.Produkt_A) ids.push(x.Produkt_A); if(x.Produkt_B) ids.push(x.Produkt_B); });
  P = {};
  if(ids.length){
    var p = await vg.from("v_web_produkte").select("id,name,marke,clean_score").in("id", ids);
    (p.data||[]).forEach(function(x){ P[x.id] = x; });
  }
  zeige();
}
var P = {};
function zeige(){
  var rows = ZEILEN;
  function prod(id){ if(!id) return "–"; var x = P[id]; return x ? e(x.marke)+" · "+e(x.name)+" <small>"+e(id)+"</small>" : e(id)+" <small>keine Punkte</small>"; }
  function pkt(id){ var x = id && P[id]; return x && x.clean_score!=null ? Math.round(Number(x.clean_score)) : null; }
  var n = {fertig:0, wartet:0, geplant:0, meta:0};
  document.getElementById("body").innerHTML = rows.map(function(x, i){
    var a = pkt(x.Produkt_A), b = pkt(x.Produkt_B), s = STATUS[x.Status] || ["geplant", x.Status];
    /* 02.10.: auf Meta eingeplant = gruen mit Termin (Spalte Geplant_am) */
    var gp = x.Geplant_am && x.Status !== "Veröffentlicht";
    if(gp){ var dt = new Date(x.Geplant_am); s = ["meta", "Meta · " + dt.toLocaleDateString("de-DE",{weekday:"short", day:"2-digit", month:"2-digit"}) + " " + dt.toLocaleTimeString("de-DE",{hour:"2-digit", minute:"2-digit"})]; }
    n[s[0]] = (n[s[0]]||0) + 1;
    return "<tr"+(gp?" class='geplant'":"")+"><td>"+e(x.Nr)+"</td><td>"+e(x.Zeile1)+"</td><td>"+prod(x.Produkt_A)+"</td><td class='z'>"+(a==null?"–":a)+"</td>"
      +"<td>"+prod(x.Produkt_B)+"</td><td class='z'>"+(b==null?"–":b)+"</td><td class='z'>"+(a!=null&&b!=null?(a-b):"–")+"</td>"
      +"<td><span class='st "+s[0]+"'>"+e(s[1])+"</span></td><td>"+e(x.Fehlt||"")+"</td>"
      +"<td class='akt'><button title='nach oben' onclick='schiebe("+i+",-1)'"+(i===0?" disabled":"")+">▲</button>"
      +"<button title='nach unten' onclick='schiebe("+i+",1)'"+(i===rows.length-1?" disabled":"")+">▼</button>"
      +"<button class='del' title='löschen' onclick='loesche("+i+")'>✕</button></td></tr>";
  }).join("");
  document.getElementById("msg").textContent = rows.length+" Vergleiche · "+n.meta+" auf Meta geplant · "+n.fertig+" fertig · "+n.wartet+" wartet · "+n.geplant+" geplant";
}
var ZEILEN = [], BUSY = false;
function meld(t){ document.getElementById("msg").textContent = t; }

/* Reihenfolge: Nr mit der Nachbarzeile tauschen (zwei Updates per id). */
async function schiebe(i, d){
  if(BUSY) return; var a = ZEILEN[i], b = ZEILEN[i+d]; if(!a || !b) return;
  BUSY = true; meld("verschiebe …");
  var na = a.Nr, nb = b.Nr;
  var r1 = await vg.from("Instagram_Vergleich").update({ Nr: nb }).eq("id", a.id);
  var r2 = r1.error ? r1 : await vg.from("Instagram_Vergleich").update({ Nr: na }).eq("id", b.id);
  BUSY = false;
  if(r1.error || r2.error){ meld("Fehler: " + (r1.error||r2.error).message); return; }
  a.Nr = nb; b.Nr = na; ZEILEN[i] = b; ZEILEN[i+d] = a; zeige();   // sofort sichtbar
  laden();
}

/* Loeschen = ausblenden (Status 'Verworfen'), nicht hart loeschen. */
async function loesche(i){
  var x = ZEILEN[i]; if(!x || BUSY) return;
  if(!confirm("Vergleich Nr " + x.Nr + " „" + (x.Zeile1||"") + "“ löschen?")) return;
  BUSY = true; meld("lösche …");
  var r = await vg.from("Instagram_Vergleich").update({ Status: "Verworfen" }).eq("id", x.id);
  BUSY = false;
  if(r.error){ meld("Fehler: " + r.error.message); return; }
  ZEILEN.splice(i, 1); zeige();   // sofort sichtbar
  laden();
}

laden();
</script>
</body>
</html>
