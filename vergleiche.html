     Nur Anzeige. Wahrheit: public."Instagram_Vergleich" (Nr, Zeile1, Produkt_A/B,

     Alte Fassung (Kartenplanung mit Bildrechten/Upload): Git-Verlauf vor Commit

<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vergleiche · Root Index</title>
<style>
  body{ margin:0; font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif; color:#2a2640; background:#f2f0f8; }
  h1{ font-size:18px; margin:0; padding:14px 18px; background:#16233d; color:#fff; }
  .wrap{ max-width:1300px; margin:0 auto; padding:14px 18px 60px; }
  table{ width:100%; border-collapse:collapse; background:#fff; border:1px solid #dcd8ea; border-radius:10px; overflow:hidden; }
  th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:#6b6592; background:#f8f7fc; border-bottom:1px solid #dcd8ea; padding:8px; }
  td{ border-bottom:1px solid #eeecf6; padding:8px; vertical-align:top; }
  td.z{ text-align:right; font-weight:700; white-space:nowrap; }
  small{ color:#6b6592; }
  .st{ display:inline-block; border-radius:12px; padding:1px 9px; font-size:12px; font-weight:600; white-space:nowrap; }
  .fertig{ background:#e6f4ea; color:#1d6b3a; } .wartet{ background:#fdf3d7; color:#7a5406; } .geplant{ background:#eceaf3; color:#6b6592; }
  #msg{ color:#6b6592; font-size:12.5px; margin:8px 0; }
</style>
</head>
<body>
<h1>Vergleiche · Instagram &amp; Facebook</h1>
<div class="wrap">
  <div id="msg">lädt …</div>
  <table>
    <thead><tr>
      <th>Nr</th><th>Vergleich</th><th>Produkt A</th><th>Pkt</th><th>Produkt B</th><th>Pkt</th><th>Diff</th><th>Status</th><th>Was fehlt</th>
    </tr></thead>
    <tbody id="body"></tbody>
  </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Dieselben Zugangsdaten und derselbe storageKey wie app.js - die Admin-Anmeldung gilt hier mit. */
var vg = supabase.createClient("https://haurbpfkfaaehorirzee.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhdXJicGZrZmFhZWhvcmlyemVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDY2OTYsImV4cCI6MjA5Nzk4MjY5Nn0.6U0bD0m2kYM2iL0KJ9fbCFvcQMXAglr8GvwmPwyHqyw",
  { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storage:window.localStorage, storageKey:"sb-cleanbase-auth" } });

function e(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
var STATUS = { "Bereit":["fertig","fertig"], "Veröffentlicht":["fertig","online"], "In Arbeit":["wartet","wartet"], "Idee":["geplant","geplant"], "Geplant":["geplant","geplant"] };

async function laden(){
  var r = await vg.from("Instagram_Vergleich").select("*").neq("Status","Verworfen").order("Nr",{ascending:true,nullsFirst:false});
  if(r.error){ document.getElementById("msg").textContent = "Fehler: " + r.error.message + " (im Admin angemeldet?)"; return; }
  var rows = r.data || [], ids = [];
  rows.forEach(function(x){ if(x.Produkt_A) ids.push(x.Produkt_A); if(x.Produkt_B) ids.push(x.Produkt_B); });
  var P = {};
  if(ids.length){
    var p = await vg.from("v_web_produkte").select("id,name,marke,clean_score").in("id", ids);
    (p.data||[]).forEach(function(x){ P[x.id] = x; });
  }
  function prod(id){ if(!id) return "–"; var x = P[id]; return x ? e(x.marke)+" · "+e(x.name)+" <small>"+e(id)+"</small>" : e(id)+" <small>keine Punkte</small>"; }
  function pkt(id){ var x = id && P[id]; return x && x.clean_score!=null ? Math.round(Number(x.clean_score)) : null; }
  var n = {fertig:0, wartet:0, geplant:0};
  document.getElementById("body").innerHTML = rows.map(function(x){
    var a = pkt(x.Produkt_A), b = pkt(x.Produkt_B), s = STATUS[x.Status] || ["geplant", x.Status];
    n[s[0]] = (n[s[0]]||0) + 1;
    return "<tr><td>"+e(x.Nr)+"</td><td>"+e(x.Zeile1)+"</td><td>"+prod(x.Produkt_A)+"</td><td class='z'>"+(a==null?"–":a)+"</td>"
      +"<td>"+prod(x.Produkt_B)+"</td><td class='z'>"+(b==null?"–":b)+"</td><td class='z'>"+(a!=null&&b!=null?(a-b):"–")+"</td>"
      +"<td><span class='st "+s[0]+"'>"+e(s[1])+"</span></td><td>"+e(x.Fehlt||"")+"</td></tr>";
  }).join("");
  document.getElementById("msg").textContent = rows.length+" Vergleiche · "+n.fertig+" fertig · "+n.wartet+" wartet · "+n.geplant+" geplant";
}
laden();
</script>
</body>
</html>
