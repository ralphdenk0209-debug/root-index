# =============================================================================
#  Produktseiten, Sitemap und robots.txt bauen   (Work #726, Projekt SE)
# -----------------------------------------------------------------------------
#  WARUM HIER UND NICHT AUF RALPHS MAC: der Generator muss die oeffentliche
#  Sicht v_web_produkte lesen. Das Repo ist seit E47 die Wahrheit, und GitHub
#  Actions ist der einzige Ort, der beim Bauen Netz zur Datenbank hat, ohne
#  dass jemand etwas anklicken muss. Der anon-Key steht ohnehin in app.js.
#
#  Laeuft taeglich nachts und auf Knopfdruck (Actions -> Run workflow).
#  Schreibt nur, wenn sich etwas geaendert hat - sonst kein Commit, kein
#  Pages-Build.
# =============================================================================
name: Produktseiten und Sitemap

on:
  schedule:
    - cron: "40 2,14 * * *"   # zweimal taeglich: 04:40 und 16:40 deutscher Sommerzeit
  workflow_dispatch:
  push:
    # Aendert sich der Generator oder dieser Workflow, wird sofort neu gebaut -
    # sonst faellt ein Fehler erst am naechsten Morgen auf. Die eigenen Commits
    # des Bots fassen nur produkt/, sitemap.xml und robots.txt an und loesen
    # hier nichts aus.
    paths:
      - "_werkzeuge/produktseiten-generieren.mjs"
      - "_werkzeuge/produktseiten-international.mjs"
      - ".github/workflows/produktseiten.yml"

permissions:
  contents: write

concurrency:
  group: produktseiten
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Seiten erzeugen
        run: |
          set -o pipefail
          node _werkzeuge/produktseiten-generieren.mjs 2>&1 | tee /tmp/gen.log
          # 28.09.2026 (Ralph "ja auf jeden fall"): englische/franzoesische Seiten
          # fuer die Maerkte UK/US/FR (en/product/, fr/produit/, sitemap-int.xml).
          # Eigener Lauf NACH dem deutschen: schlaegt er fehl, bleiben die
          # deutschen Seiten trotzdem vollstaendig und werden veroeffentlicht.
          node _werkzeuge/produktseiten-international.mjs 2>&1 | tee -a /tmp/gen.log || echo "International fehlgeschlagen - deutsche Seiten laufen weiter."

      # Die Actions-Logs sieht nur, wer bei GitHub angemeldet ist, und die
      # Job-Zusammenfassung ebenso. Damit ein Fehlschlag von aussen ueberhaupt
      # lesbar ist, landet die Ausgabe als Datei im Repo. Sie wird bei jedem
      # Lauf ueberschrieben und loest selbst keinen neuen Lauf aus.
      - name: Ausgabe sichtbar machen
        if: always()
        run: |
          {
            echo "Lauf: $GITHUB_RUN_NUMBER · Commit: $GITHUB_SHA · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "---"
            tail -n 60 /tmp/gen.log 2>/dev/null || echo "(keine Ausgabe)"
          } > _werkzeuge/letzter-lauf.log
          {
            echo '### Generator-Ausgabe'
            echo '```'
            cat _werkzeuge/letzter-lauf.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "root-index-bot"
          git config user.email "bot@root-index.de"
          # Ein Lauf dauert Minuten. Wird in dieser Zeit von Hand gepusht,
          # weist GitHub den Push des Bots ab - daran ist Lauf #16 gescheitert,
          # nachdem waehrend des Laufs am Postfach gearbeitet wurde. Also vor
          # jedem Versuch die fremden Commits darunter schieben (rebase) und
          # bis zu fuenfmal probieren.
          # 27.09.2026 (Ralph: "push etwas erhoehen"): Lauf #43 hat 18 Minuten
          # lang 60.608 Seiten gebaut und ist dann am Pushen gescheitert, weil
          # aus anderen Chats waehrend des Laufs mehrfach ins selbe Repo
          # gepusht wurde. Fuenf Versuche im Fuenf-Sekunden-Takt decken ein
          # knappes halbes Minutenfenster ab - zu wenig. Jetzt acht Versuche
          # mit wachsender Pause (10, 20, 30 ... Sekunden), zusammen gut sechs
          # Minuten. Das kostet KEINE zusaetzliche Datenbanklast: wiederholt
          # wird nur der Push, nicht der Generatorlauf.
          sicher_pushen() {
            for versuch in 1 2 3 4 5 6 7 8; do
              git pull --rebase --autostash -q origin main || true
              if git push; then return 0; fi
              echo "Push abgewiesen (Versuch $versuch) - erneut nach fremden Commits"
              sleep $((versuch * 10))
            done
            echo "Push nach acht Versuchen nicht durchgekommen."
            return 1
          }

          # Das Protokoll ist eine Nebensache. Kommt es nicht durch, darf das
          # NICHT den ganzen Lauf beenden - genau daran ist #43 gestorben,
          # bevor die 60.608 fertig gebauten Seiten ueberhaupt committet
          # wurden. Also Fehler hier ausdruecklich schlucken; die Seiten
          # kommen im Schritt "Aenderungen committen" dran, und der meldet
          # einen Fehlschlag weiterhin.
          git add _werkzeuge/letzter-lauf.log
          git diff --cached --quiet || { git commit -m "Lauf-Protokoll [skip ci]"; sicher_pushen || echo "Protokoll nicht gepusht - der Lauf geht trotzdem weiter."; }

      - name: Gegenmessen (nichts Leeres veroeffentlichen)
        run: |
          set -e
          SEITEN=$(ls produkt/*.html | wc -l)
          URLS=$(grep -c "<loc>" sitemap.xml)
          echo "Seiten: $SEITEN · Sitemap-URLs: $URLS"
          test -s robots.txt
          test "$SEITEN" -ge 1000
          test "$URLS" -ge 1000

      - name: Aenderungen committen
        run: |
          set -e
          git config user.name "root-index-bot"
          git config user.email "bot@root-index.de"
          # Ein Lauf dauert Minuten. Wird in dieser Zeit von Hand gepusht,
          # weist GitHub den Push des Bots ab - daran ist Lauf #16 gescheitert,
          # nachdem waehrend des Laufs am Postfach gearbeitet wurde. Also vor
          # jedem Versuch die fremden Commits darunter schieben (rebase) und
          # bis zu fuenfmal probieren.
          # 27.09.2026 (Ralph: "push etwas erhoehen"): Lauf #43 hat 18 Minuten
          # lang 60.608 Seiten gebaut und ist dann am Pushen gescheitert, weil
          # aus anderen Chats waehrend des Laufs mehrfach ins selbe Repo
          # gepusht wurde. Fuenf Versuche im Fuenf-Sekunden-Takt decken ein
          # knappes halbes Minutenfenster ab - zu wenig. Jetzt acht Versuche
          # mit wachsender Pause (10, 20, 30 ... Sekunden), zusammen gut sechs
          # Minuten. Das kostet KEINE zusaetzliche Datenbanklast: wiederholt
          # wird nur der Push, nicht der Generatorlauf.
          sicher_pushen() {
            for versuch in 1 2 3 4 5 6 7 8; do
              git pull --rebase --autostash -q origin main || true
              if git push; then return 0; fi
              echo "Push abgewiesen (Versuch $versuch) - erneut nach fremden Commits"
              sleep $((versuch * 10))
            done
            echo "Push nach acht Versuchen nicht durchgekommen."
            return 1
          }

          git add -A produkt sitemap.xml robots.txt
          # International (28.09.2026): fehlt der Ordner nach einem Fehlschlag, darf das den Commit nicht stoppen.
          git add -A en/product fr/produit sitemap-int.xml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nichts geaendert - kein Commit."
          else
            git commit -m "Produktseiten und Sitemap neu gebaut (automatisch)"
            sicher_pushen
          fi
