# =============================================================================
#  Edge-Funktionen ausliefern   (13.09.2026, Ralph "4 mach")
# -----------------------------------------------------------------------------
#  WARUM: Bis heute musste jede Edge-Funktion von Hand deployt werden
#  (Deploy-Funktionen.command auf dem Mac). Ralphs Annahme "ist doch direkt auf
#  git" stimmte fuer die Webseite, nicht fuer die Funktionen - die lagen in
#  einem lokalen Git-Ordner ohne Remote. Seit heute liegen sie hier im Repo,
#  und dieser Workflow liefert aus, was sich geaendert hat.
#
#  EINMALIG NOETIG: Settings -> Secrets and variables -> Actions ->
#  New repository secret, Name SUPABASE_ACCESS_TOKEN, Wert aus
#  https://supabase.com/dashboard/account/tokens
#
#  Deployt NUR geaenderte Funktionen. Ohne Aenderung passiert nichts.
#  Auf Knopfdruck (Actions -> Run workflow) laesst sich auch eine einzelne
#  Funktion oder "alle" ausliefern.
# =============================================================================
name: Edge-Funktionen ausliefern

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-funktionen.yml"
  workflow_dispatch:
    inputs:
      funktion:
        description: 'Welche Funktion? Name, oder "alle"'
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: edge-funktionen
  cancel-in-progress: false

env:
  PROJEKT_REF: haurbpfkfaaehorirzee

jobs:
  ausliefern:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # fuer den Vergleich mit dem Commit davor

      - name: Zugangstoken pruefen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Das Secret SUPABASE_ACCESS_TOKEN fehlt. Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Welche Funktionen haben sich geaendert?
        id: auswahl
        run: |
          set -euo pipefail
          WUNSCH="${{ github.event.inputs.funktion }}"
          if [ "$WUNSCH" = "alle" ]; then
            LISTE=$(ls supabase/functions)
          elif [ -n "$WUNSCH" ]; then
            if [ ! -d "supabase/functions/$WUNSCH" ]; then
              echo "::error::supabase/functions/$WUNSCH gibt es nicht."
              exit 1
            fi
            LISTE="$WUNSCH"
          else
            # Alles, was dieser Push unter supabase/functions/ angefasst hat.
            LISTE=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'supabase/functions/**' \
                    | awk -F/ 'NF>2 {print $3}' | sort -u || true)
          fi
          echo "Gefunden:"; echo "$LISTE"
          echo "liste<<ENDE" >> $GITHUB_OUTPUT
          echo "$LISTE" >> $GITHUB_OUTPUT
          echo "ENDE" >> $GITHUB_OUTPUT

      - name: Ausliefern
        if: steps.auswahl.outputs.liste != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          FEHLER=0
          while read -r fn; do
            [ -z "$fn" ] && continue
            echo "::group::$fn"
            if supabase functions deploy "$fn" --project-ref "$PROJEKT_REF"; then
              echo "$fn ausgeliefert."
            else
              echo "::error::$fn konnte nicht ausgeliefert werden."
              FEHLER=1
            fi
            echo "::endgroup::"
          done <<< "${{ steps.auswahl.outputs.liste }}"
          exit $FEHLER

      - name: Gegenmessen
        if: steps.auswahl.outputs.liste != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Nicht nur "Befehl lief durch", sondern: steht die Funktion auf ACTIVE?
          supabase functions list --project-ref "$PROJEKT_REF" || true

      - name: Nichts zu tun
        if: steps.auswahl.outputs.liste == ''
        run: echo "Keine Funktion geaendert - nichts ausgeliefert."
