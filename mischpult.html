     "ich muss alles verwalten können und im blick haben").
     Jeder Bereich ein Kanalzug: Lampe, Wert, Verlauf, Notiz, Schalter, Knopf.
     Liest NUR cb_admin_mischpult_lesen (Vorrat aus cb_admin_mischpult, alle 5 Min.; baut auf cb_admin_cockpit_ampel / _dblast / _social auf - keine eigene Fachlogik).
     Schreibt NUR ueber cb_admin_mischpult_schalten (Feature-Flags etikett_riki, rezept_riki, push; mit Protokoll)
     und cb_claude_kosten_sync (Knopf "Jetzt abrufen"). Waechter-Faelle ueber cb_admin_cockpit_waechter_faelle. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#16171a;--card:#1f2024;--card2:#1b1c20;--line:#2e3035;--text:#ecebe7;--muted:#9a9890;--ok:#4fd18b;--warn:#ffb547;--alarm:#ff5a4f;--off:#4a4c52}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  a{color:var(--warn)} a:hover{color:#ffd28f}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1500px;margin:0 auto;padding:22px 20px 40px}
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}
  h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.02em}
  .lead{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .master{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
  .master b{font-size:18px} .master small{display:block;font-size:12px;color:var(--muted)}
  .lamp{display:inline-block;border-radius:50%;flex-shrink:0;vertical-align:middle}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .blink{animation:blink 1.1s ease-in-out infinite}
  .pult{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
  .zug{display:flex;flex-direction:column;gap:9px;background:linear-gradient(#222327,#1c1d21);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
  .zug.warn{border-color:#4d3a1c} .zug.alarm{border-color:#5a2a27}
  .zug .top{display:flex;justify-content:center;padding-top:2px}
  .grp{font-family:"Archivo Narrow",sans-serif;font-size:11.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;text-align:center}
  .nm{font-size:15.5px;font-weight:700;text-align:center;line-height:1.2}
  .wert{text-align:center;background:#111214;border-radius:8px;padding:8px 4px}
  .wert .v{font-size:25px;font-weight:800;line-height:1.1}
  .wert .u{font-size:11px;color:var(--muted)}
  .bars{display:flex;align-items:flex-end;gap:2px;height:58px;padding:0 3px}
  .bars i{flex:1;border-radius:2px;min-height:3px;display:block}
  .seg{display:flex;height:14px;border-radius:4px;overflow:hidden;margin:22px 3px}
  .notiz{font-size:12px;color:#c9c7c0;text-align:center;min-height:34px}
  .schalt{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:12px;font-weight:600;width:100%;text-align:left}
  .spur{position:relative;width:38px;height:22px;border-radius:11px;flex-shrink:0;background:#3a3c41;transition:background .2s}
  .spur::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
  .schalt[aria-pressed="true"] .spur{background:var(--ok)} .schalt[aria-pressed="true"] .spur::after{left:19px}
  .knopf{display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:10px;border:0;background:#2e3035;color:var(--text);font-size:13px;font-weight:700;text-decoration:none;text-align:center;padding:0 8px}
  .knopf:hover{color:var(--text);filter:brightness(1.15)}
  .zug.warn .knopf.haupt{background:var(--warn);color:#1a0f0e} .zug.alarm .knopf.haupt{background:var(--alarm);color:#1a0f0e}
  .unten{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:10px;margin-top:14px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .box h2{margin:0 0 8px;font-size:15px}
  .log div{display:flex;gap:12px;font-size:13px;padding:5px 0;border-top:1px solid #2a2c30}
  .log span:first-child{color:var(--muted);width:110px;flex-shrink:0}
  .schnell{display:flex;flex-wrap:wrap;gap:8px}
  .schnell a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:10px;background:#2a2c30;color:var(--text);text-decoration:none;font-size:13px;font-weight:600}
  .schnell a:hover{background:#34363b}
  /* 25.10.2026: Aufgaben-Kachel (eine Liste fuer alle Chats, Tabelle agent_projekt_aufgabe) */
  .aufZ{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .aufZ div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .aufZ b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .aufZ span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .aufZ .me{border-color:var(--ok)}
  .aufL div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid #2a2c30;font-size:13px}
  .aufL small{grid-column:1/-1;color:var(--muted);font-size:11.5px}
  .aufL .rot{color:var(--alarm);font-weight:800;margin-right:4px}
  .aufL button{border:1px solid var(--line);background:#2a2c30;color:var(--text);border-radius:8px;padding:4px 9px;cursor:pointer;font:inherit;font-size:12px}
  .aufL button.ok{border-color:var(--ok);color:var(--ok)}
  .aufL button[disabled]{opacity:.45;cursor:default}
  .aufMehr{display:inline-block;margin-top:10px;color:var(--ok);font-weight:700;font-size:13px;text-decoration:none}
  #pop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20}
  #pop .in{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:1000px;width:100%;max-height:82vh;overflow:auto;padding:16px}
  #pop h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:16px}
  #pop table{width:100%;border-collapse:collapse;font-size:12.5px}
  #pop th,#pop td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  .wl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:#26272b;margin-bottom:6px;border:0;color:var(--text);width:100%;font-size:14px;text-align:left;min-height:44px}
  #hinweis{display:none;background:#3a2020;border:1px solid #5a2a27;border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .fehler{color:var(--alarm)}
  body.eingebettet .wrap{padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Root Index · Mischpult</h1>
      <p class="lead"><span id="tag"></span> · <span id="stand">lädt …</span> · aktualisiert sich jede Minute</p>
    </div>
    <div class="master"><span id="mLampe"></span><div><b id="mText">…</b><small id="mSub"></small></div></div>
  </header>
  <div id="hinweis">Kein Zugriff – bitte <a href="admin.html" target="_top">im Admin anmelden</a>, dann neu laden.</div>
  <section class="pult" id="pult" aria-label="Kanalzüge"></section>
  <section class="unten">
    <div class="box" id="aufBox"><h2>Aufgaben</h2><div class="aufZ"><div class="me"><b id="aufDir">–</b><span>Bei dir</span></div><div><b id="aufChk">–</b><span>Zum Abhaken</span></div><div><b id="aufCl">–</b><span>Bei Claude</span></div></div><div class="aufL" id="aufL"><div><span style="color:var(--muted)">lädt …</span></div></div><a class="aufMehr" href="https://claude.ai/artifact/7BUZPuyLfmKKWDmaBZsqLN" target="_blank" rel="noopener">Alle Aufgaben ansehen ↗</a></div>
    <div class="box"><h2>Zuletzt geschaltet</h2><div class="log" id="log"><div><span>–</span><span>noch nichts geschaltet</span></div></div></div>
    <div class="box"><h2>Schnellwahl</h2><div class="schnell" id="schnell"></div></div>
  </section>
</div>
<div id="pop" role="dialog" aria-modal="true"><div class="in" id="popIn"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://haurbpfkfaaehorirzee.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhdXJicGZrZmFhZWhvcmlyemVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDY2OTYsImV4cCI6MjA5Nzk4MjY5Nn0.6U0bD0m2kYM2iL0KJ9fbCFvcQMXAglr8GvwmPwyHqyw";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storage: window.localStorage, storageKey:"sb-cleanbase-auth" }
});
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const zahl = (x,st=0) => x==null||x==='' ? '–' : Number(x).toLocaleString('de-DE',{maximumFractionDigits:st});
const usd = x => x==null ? '–' : Number(x).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' $';
const zeit = d => d ? new Date(d).toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '–';
const FARBE_HEX = {ok:'#4fd18b',warn:'#ffb547',alarm:'#ff5a4f',off:'#4a4c52'};
const SCHALTER = {etikett_riki:'Etikett-Scan (Riki, kostet)', rezept_riki:'Rezept-Scan (Riki, kostet)', push:'Push-Mitteilungen'};
if(window.self!==window.top) document.body.classList.add('eingebettet');
/* 21.10.2026: dieses Geraet gehoert zu uns - Besuche von hier zaehlen als "eigen", nicht als Besucher. */
try{ localStorage.setItem('ri_intern','1'); }catch(e){}
(function(){ const t=Math.floor((Date.now()-new Date('2026-06-25T00:00:00'))/86400000)+1; $('tag').textContent='Tag '+t+' seit Start'; })();

let D=null;

function lampe(st, gross){
  const c=FARBE_HEX[st]||FARBE_HEX.off, s=gross?26:18;
  return '<span class="lamp'+(st==='alarm'?' blink':'')+'" style="width:'+s+'px;height:'+s+'px;background:radial-gradient(circle at 35% 30%,#ffffffaa,'+c+' 55%);'+(st==='off'?'':'box-shadow:0 0 10px '+c+',0 0 22px '+c+'66')+'"></span>';
}
function bars(vals, st){
  vals=(vals||[]).map(v=>Number(v)||0); if(!vals.length) return '<div class="bars"></div>';
  const m=Math.max(...vals,0.0001), c=FARBE_HEX[st]||FARBE_HEX.ok;
  return '<div class="bars" aria-hidden="true">'+vals.map((v,i)=>'<i title="'+zahl(v,2)+'" style="height:'+Math.max(4,v/m*100)+'%;background:'+(i===vals.length-1?c:c+'66')+'"></i>').join('')+'</div>';
}
function seg(teile){
  const s=teile.reduce((a,t)=>a+(Number(t[0])||0),0)||1;
  return '<div class="seg" aria-hidden="true">'+teile.map(t=>'<i style="display:block;width:'+Math.max(t[0]?1.5:0,100*(Number(t[0])||0)/s)+'%;background:'+t[1]+'"></i>').join('')+'</div>';
}
/* Ein Kanalzug. z = {grp,nm,st,v,u,viz,notiz,schalter:[{k,an}],knopf:{t,href|onclick,ziel},knopf2} */
function zug(z){
  let h='<div class="zug '+(z.st==='warn'||z.st==='alarm'?z.st:'')+'">';
  h+='<div class="top">'+lampe(z.st)+'</div><div><div class="grp">'+esc(z.grp)+'</div><div class="nm">'+esc(z.nm)+'</div></div>';
  h+='<div class="wert"><div class="v" style="color:'+(z.st==='off'?'#6b6d73':'var(--text)')+'">'+z.v+'</div><div class="u">'+esc(z.u||'')+'</div></div>';
  h+=(z.viz||'<div class="bars"></div>');
  h+='<div class="notiz">'+(z.notiz||'')+'</div>';
  (z.schalter||[]).forEach(s=>{ h+='<button type="button" class="schalt" aria-pressed="'+(s.an?'true':'false')+'" onclick="schalten(\''+s.k+'\','+(!s.an)+')"><span>'+esc(SCHALTER[s.k]||s.k)+'</span><span class="spur"></span></button>'; });
  [z.knopf,z.knopf2].filter(Boolean).forEach((k,i)=>{
    h+= k.href ? '<a class="knopf'+(i===0?' haupt':'')+'" href="'+k.href+'" target="'+(k.ziel||'_blank')+'" rel="noopener">'+esc(k.t)+'</a>'
               : '<button type="button" class="knopf'+(i===0?' haupt':'')+'" onclick="'+k.onclick+'">'+esc(k.t)+'</button>';
  });
  return h+'</div>';
}
const cb = u => u+(u.includes('?')?'&':'?')+'cb='+Date.now();

function bauen(){
  const d=D, m=d.maschine||{}, w=d.waechter||{}, p=d.produkte||{}, db=d.db||{}, se=d.seite||{}, me=d.menschen||{},
        ri=d.riki||{}, cl=d.claude||{}, so=(d.social||{}).kanaele||{}, s7=(d.social||{}).summe7||{}, co=d.content||{},
        nl=d.newsletter||{}, as=d.appstore||{}, sch=d.schalter||[];
  const Z=[];
  /* Maschine */
  const mSt = m.ampel==='rot' ? 'alarm' : m.ampel==='gelb' ? 'warn' : 'ok';
  Z.push({grp:'Maschine',nm:'Kette & Takte',st:mSt,v:zahl(m.aktiv)+'<span style="font-size:15px;color:var(--muted)"> / '+zahl(m.gesamt)+'</span>',u:'Takte aktiv',
    viz:bars(m.verlauf,mSt), notiz:zahl(m.still)+' still · '+zahl(m.rot)+' rot · '+zahl(m.fehler_24h)+' Fehler 24 h',
    knopf:{t:'Maschine öffnen',href:cb('maschine.html')}});
  /* Waechter */
  const wm=w.melden||[], wGate=wm.some(x=>x.gate===true);
  const wSt = !wm.length ? 'ok' : wGate ? 'alarm' : 'warn';
  Z.push({grp:'Maschine',nm:'Wächter',st:wSt,v:zahl(wm.length),u:'von '+zahl(w.gesamt)+' melden',
    viz:'<div class="bars" style="align-items:center;justify-content:center;flex-wrap:wrap;gap:4px">'+Array.from({length:Math.min(w.gesamt||0,42)},(_,i)=>'<span class="lamp" style="width:7px;height:7px;background:'+(i<wm.length?(wGate?FARBE_HEX.alarm:FARBE_HEX.warn):'#2f5a43')+'"></span>').join('')+'</div>',
    notiz: wm.length ? wm.slice(0,2).map(x=>esc(x.name)+' ('+x.n+')').join('<br>') : 'alle still',
    knopf:{t: wm.length?'Fälle ansehen':'Alle Wächter',onclick:'waechterListe()'}});
  /* Produkte */
  const pSt = (p.blockiert_riki>0) ? 'alarm' : (p.freigabebereit>0 || p.zu_verifizieren>0) ? 'warn' : 'ok';
  Z.push({grp:'Katalog',nm:'Produkte',st:pSt,v:zahl(p.aktiv),u:'aktiv',
    viz:seg([[p.aktiv,'#4fd18b'],[p.freigabebereit,'#ffb547'],[p.import_offen,'#6a7cff'],[p.abgelehnt,'#4a4c52']]),
    notiz:zahl(p.freigabebereit)+' freigabebereit · '+zahl(p.import_offen)+' Import offen · +'+zahl(p.neu_7t)+' neu (7 T)',
    knopf:{t:'Erfassen',href:'admin.html?go=produkterfassung',ziel:'_top'}});
  /* Datenbank */
  const dbPct = db.max_verbindungen ? Math.round(100*db.verbindungen/db.max_verbindungen) : null;
  const dbSt = dbPct==null ? 'off' : dbPct>80 ? 'alarm' : dbPct>60 ? 'warn' : 'ok';
  Z.push({grp:'Technik',nm:'Datenbank',st:dbSt,v:dbPct==null?'–':dbPct+' %',u:'Verbindungen belegt',
    viz:seg([[db.verbindungen,FARBE_HEX[dbSt]||'#4fd18b'],[(db.max_verbindungen||0)-(db.verbindungen||0),'#2a2c30']]),
    notiz:zahl(db.verbindungen)+' / '+zahl(db.max_verbindungen)+' · Platte '+zahl((db.platte||0)/1e9,2)+' GB · '+zahl(db.wartend)+' wartend',
    knopf:{t:'Supabase',href:'https://supabase.com/dashboard/project/haurbpfkfaaehorirzee/reports/database'}});
  /* Seite & Google */
  const seSt = se.ampel==='rot'?'alarm':se.ampel==='gelb'?'warn':'ok';
  Z.push({grp:'Web',nm:'Seite & Google',st:seSt,v:zahl(se.besucher_14t),u:'Besucher 14 Tage',viz:bars(se.besucher,seSt),
    notiz:'Google '+zahl(se.klicks_28t)+' Klicks 28 T · Pos. '+zahl(se.position,1)+'<br>'+zahl(se.klicks_7t)+' Klicks 7 T ('+(se.delta_pct>0?'+':'')+zahl(se.delta_pct)+' %)',
    notiz2:1, knopf:{t:'Search Console',href:'https://search.google.com/search-console'}});
  /* 21.10.2026: Besuche je Social-Kanal (7 Tage, ohne eigene Geraete) - zeigt, ob die Posts Besucher bringen. */
  (function(){ const bq=d.besuch_quellen||{}, z=Z[Z.length-1];
    const soz=[['instagram','IG'],['facebook','FB'],['youtube','YT'],['tiktok','TT'],['pinterest','Pin'],['threads','Th']].map(function(k){ return k[1]+' '+zahl(bq[k[0]]||0); }).join(' · ');
    z.notiz += '<br><b>Aus Social (7 T):</b> '+soz; })();
  /* Nutzer */
  const akt=Number(me.aktiv_7t||0), pre=Number(me.premium||0), nut=Number(me.nutzer||0);
  Z.push({grp:'App',nm:'Nutzer',st:'ok',v:zahl(nut),u:zahl(pre)+' Premium'+(Number(me.premium_geschenkt||0)?' · '+zahl(me.premium_geschenkt)+' geschenkt':''),
    viz:seg([[pre,'#ffb547'],[Math.max(0,akt-pre),'#4fd18b'],[Math.max(0,nut-Math.max(akt,pre)),'#3a3c41']]),
    notiz:'ohne '+zahl(me.ausgenommen)+' interne Konten · '+zahl(akt)+' aktiv (7 T) · '+zahl(me.tagebuch_7t)+' Tagebuch-Einträge · '+zahl(me.scans_warteschlange)+' Scans in Warteschlange',
    knopf:{t:'Nutzer',href:'admin.html?go=nutzer',ziel:'_top'}});
  /* App Store */
  const asSt = as.sync_ok===false ? 'alarm' : (as.rez_offen>0 ? 'warn' : 'ok');
  Z.push({grp:'App',nm:'App Store',st:asSt,v:zahl(as.downloads_ges),u:'Downloads gesamt',viz:bars(as.verlauf,asSt),
    notiz:zahl(as.downloads_7)+' in 7 T · '+zahl(as.rez_offen)+' Rezensionen offen'+(as.sterne?' · ★ '+zahl(as.sterne,1):'')+'<br>Abruf '+zeit(as.sync_zeit),
    knopf:{t:'App Store',href:cb('appstore.html')}});
  /* Social */
  const ig=so.instagram||{}, fb=so.facebook||{};
  Z.push({grp:'Social',nm:'Instagram',st:'ok',v:zahl(ig.follower),u:'Follower',viz:bars(ig.verlauf,'ok'),
    notiz:zahl(ig.aufrufe_7)+' Aufrufe · '+zahl(ig.reichweite_7)+' erreicht (7 T)',
    knopf:{t:'Instagram',href:'https://www.instagram.com/root_index.de/'}});
  Z.push({grp:'Social',nm:'Facebook',st:'ok',v:zahl(fb.follower),u:'Follower',viz:bars(fb.verlauf,'ok'),
    notiz:'alle Kanäle 7 T: '+zahl(s7.interaktionen)+' Interaktionen · '+zahl(s7.profilaufrufe)+' Profilaufrufe',
    knopf:{t:'Meta Business Suite',href:'https://business.facebook.com/latest/content_calendar'}});
  /* 19.10.2026, Ralph: "es fehlt tiktok und youtube". Follower gibt es dort (noch) nicht automatisch:
     Ralph traegt sie per Knopf ein (cb_admin_social_follower_setzen). Gepostet/Rueckstand kommen aus dem Content-Plan. */
  const po=d.posts||{}, rk=co.rueckstand||{};
  [['youtube','YouTube','https://studio.youtube.com'],['tiktok','TikTok','https://www.tiktok.com/tiktokstudio']].forEach(function(c){
    const kd=so[c[0]]||{}, rueck=Number(rk[c[0]]||0);
    Z.push({grp:'Social',nm:c[1],st: rueck>0?'warn':'ok', v: kd.follower!=null?zahl(kd.follower):'–', u: kd.follower!=null?'Follower':'Follower noch nicht eingetragen',
      viz:bars(kd.verlauf,'ok'), notiz: zahl(po[c[0]])+' Reels gepostet'+(rueck?' · '+rueck+' im Rückstand':' · gleichauf')+(kd.stand?'<br>Follower-Stand '+new Date(kd.stand).toLocaleDateString('de-DE'):''),
      knopf:{t:'Follower eintragen',onclick:"followerEintragen('"+c[0]+"','"+c[1]+"')"}, knopf2:{t:c[1]+' Studio',href:c[2]}});
  });
  /* Content-Plan */
  const rs=co.rueckstand||{}, rsTxt=Object.keys(rs).filter(k=>rs[k]>0).map(k=>({youtube:'YouTube',tiktok:'TikTok',pinterest:'Pinterest',substack:'Substack'}[k]||k)+' '+rs[k]);
  const coSt = !co.naechstes ? 'alarm' : (co.luecke_tage>2 || rsTxt.length) ? 'warn' : 'ok';
  Z.push({grp:'Social',nm:'Content-Plan',st:coSt,v:zahl(co.woche),u:'Reels diese Woche',
    viz:'<div class="bars" style="flex-direction:column;align-items:stretch;justify-content:center;gap:3px;font-size:12px;text-align:center"><span style="color:var(--muted)">nächstes Reel</span><b>'+zeit(co.naechstes)+'</b><span style="color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(co.naechstes_titel||'')+'</span></div>',
    notiz:(co.luecke_tage?zahl(co.luecke_tage)+' von 7 Tagen ohne Reel':'jeden Tag etwas geplant')+'<br>'+(rsTxt.length?'Rückstand: '+rsTxt.join(' · '):'alle Kanäle gleichauf'),
    knopf:{t:'Content-Plan',href:cb('vergleiche.html')}});
  /* Newsletter */
  const nx=nl.naechste;
  const nlSt = nx && nx.status==='entwurf' && new Date(nx.geplant_fuer)-Date.now() < 3*86400000 ? 'warn' : 'ok';
  Z.push({grp:'Post',nm:'Newsletter',st:nlSt,v:zahl(nl.abonnenten),u:'Abonnenten',
    viz:seg([[nl.freigegeben,'#4fd18b'],[nl.entwuerfe,'#ffb547']]),
    notiz: nx ? 'Nr. '+esc(nx.nr)+' „'+esc(nx.betreff)+'“<br>'+esc(nx.status)+' · '+zeit(nx.geplant_fuer) : zahl(nl.entwuerfe)+' Entwürfe',
    knopf:{t: nlSt==='warn'?'Freigeben':'Newsletter',href:cb('newsletter.html')}});
  /* Claude-Kosten (echte Rechnung aus der Claude Console, taeglich 06:47 UTC) */
  const clTage=(cl.tage||[]).map(t=>Number(t.usd)||0), clMax=Math.max(0,...clTage);
  const tb=Number(ri.tagesbudget||5), clSt = clMax>tb ? 'alarm' : clMax>tb*0.6 ? 'warn' : 'ok';
  Z.push({grp:'Geld',nm:'Claude-Kosten',st:clSt,v:usd(cl.monat),u:'diesen Monat (Rechnung)',viz:bars(clTage,clSt),
    notiz:usd(cl.summe_7)+' in 7 Tagen · Tagesgrenze '+usd(tb)+'<br>Stand '+zeit(cl.geholt),
    knopf:{t:'Jetzt abrufen',onclick:'claudeAbrufen(this)'}, knopf2:{t:'Console',href:'https://console.anthropic.com/settings/cost'}});
  /* Riki-Scans + Kostenschalter */
  const riSt = Number(ri.heute)>tb ? 'alarm' : Number(ri.monat)>Number(ri.budget||150)*0.8 ? 'warn' : 'ok';
  const sMap={}; sch.forEach(s=>sMap[s.k]=s.an);
  const scanAus = sMap.etikett_riki===false && sMap.rezept_riki===false;
  Z.push({grp:'Geld',nm:'Riki-Scans',st: scanAus?'off':riSt, v:usd(ri.monat),u:'von '+usd(ri.budget)+' Monatsbudget',viz:bars(ri.tage,riSt),
    notiz:'heute '+usd(ri.heute)+' · die Schalter stoppen die bezahlten Scans für alle Nutzer',
    schalter:[{k:'etikett_riki',an:sMap.etikett_riki},{k:'rezept_riki',an:sMap.rezept_riki}],
    knopf:{t:'Kosten je Aufruf',href:cb('riki-kosten.html')}});
  /* App-Funktionen */
  Z.push({grp:'App',nm:'Funktionen',st: sMap.push===false?'off':'ok', v: sch.filter(s=>s.an).length+' / '+sch.length, u:'eingeschaltet',
    viz:'<div class="bars"></div>', notiz:'Push-Mitteilungen für alle Nutzer an/aus',
    schalter:[{k:'push',an:sMap.push}], knopf:{t:'Monatsbericht',href:cb('monatsbericht.html')}});

  /* 19.10.2026, Ralph: "social media sollten nebeneinander sein" - feste Reihenfolge: erst Betrieb, dann Social & Post & Geld. */
  const REIHE=['Kette & Takte','Wächter','Produkte','Datenbank','Seite & Google','Nutzer','App Store','Funktionen',
               'Instagram','Facebook','YouTube','TikTok','Content-Plan','Newsletter','Claude-Kosten','Riki-Scans'];
  Z.sort(function(a,b){ return REIHE.indexOf(a.nm)-REIHE.indexOf(b.nm); });
  $('pult').innerHTML=Z.map(zug).join('');
  /* Master-Lampe */
  const rot=Z.filter(z=>z.st==='alarm').length, gelb=Z.filter(z=>z.st==='warn').length;
  $('mLampe').innerHTML=lampe(rot?'alarm':gelb?'warn':'ok',true);
  $('mText').textContent = rot ? rot+' rot · '+gelb+' gelb' : gelb ? gelb+' gelb' : 'Alles grün';
  $('mSub').textContent = 'von '+Z.length+' Kanalzügen';
  /* Protokoll */
  const lg=d.log||[];
  $('log').innerHTML = lg.length ? lg.map(l=>'<div><span>'+zeit(l.zeit)+'</span><span>'+esc(SCHALTER[l.schalter]||l.schalter)+(l.an===true?' eingeschaltet':l.an===false?' ausgeschaltet':'')+(l.notiz?' – '+esc(l.notiz).slice(0,80):'')+'</span></div>').join('')
                 : '<div><span>–</span><span>noch nichts geschaltet</span></div>';
}

const SCHNELL=[
  ['Erfassen','admin.html?go=produkterfassung','_top'],['Zutatenstamm','admin.html?go=stamm','_top'],['Bundles','admin.html?go=bundles','_top'],
  ['Rezepte','admin.html?go=rezepte','_top'],['Stufen','admin.html?go=stufen','_top'],['Nutzer','admin.html?go=nutzer','_top'],
  ['Content-Plan','vergleiche.html','_blank'],['Reel-Editor','reel-editor.html','_blank'],['Newsletter','newsletter.html','_blank'],
  ['App Store','appstore.html','_blank'],['Monatsbericht','monatsbericht.html','_blank'],['Riki-Kosten','riki-kosten.html','_blank'],
  ['Produkttabelle','produkte-tabelle.html','_blank'],['Video-Skript','video-skript-01.html','_blank'],['Steuerung','steuerung.html','_blank'],
  ['Altes Cockpit','cockpit.html','_blank'],['Weltall','cockpit-weltall.html','_blank']];
$('schnell').innerHTML=SCHNELL.map(s=>'<a href="'+s[1]+'" target="'+s[2]+'" rel="noopener">'+esc(s[0])+'</a>').join('');
/* 25.10.2026: Im Admin eingebettet die Bereiche direkt oeffnen (parent.adminGo), statt admin.html neu zu laden -
   schneller und ohne Wettlauf mit dem Start-Sprung aufs Dashboard. Gilt fuer alle Knoepfe mit admin.html?go=. */
document.addEventListener('click',function(ev){
  var a=ev.target.closest&&ev.target.closest('a[href*="admin.html?go="]'); if(!a) return;
  try{ if(window.parent!==window && typeof window.parent.adminGo==='function'){
    ev.preventDefault(); window.parent.adminGo(new URL(a.href,location.href).searchParams.get('go')); } }catch(e){}
});

async function laden(){
  /* 18.10. abends: liest den vorgerechneten Stand (alle 5 Min., Cron mischpult-cache) - die Live-Rechnung dauert > 8 s. */
  const {data,error}=await client.rpc('cb_admin_mischpult_lesen');
  if(error||!data||data.ok===false){ $('hinweis').style.display='block'; $('stand').textContent=error?('Fehler: '+error.message):(data&&data.fehler)||'kein Zugriff'; return; }
  $('hinweis').style.display='none'; D=data;
  $('stand').textContent='Stand '+new Date(data.cache_stand||data.stand).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' (alle 5 Min. neu)';
  bauen();
}
async function schalten(k, an){
  const name=SCHALTER[k]||k;
  if(!confirm(name+' für alle Nutzer '+(an?'EINschalten':'AUSschalten')+'?')) return;
  const {data,error}=await client.rpc('cb_admin_mischpult_schalten',{p_schalter:k,p_an:an});
  if(error||!data||!data.ok){ alert('Nicht geschaltet: '+(error?error.message:(data&&data.fehler))); return; }
  await laden();
}
async function followerEintragen(k, name){
  const v=prompt(name+': aktuelle Follower-Zahl?'); if(v==null) return;
  const n=parseInt(String(v).replace(/\D/g,''),10); if(isNaN(n)){ alert('Bitte eine Zahl eingeben.'); return; }
  const {data,error}=await client.rpc('cb_admin_social_follower_setzen',{p_kanal:k,p_follower:n});
  if(error||!data||!data.ok){ alert('Nicht gespeichert: '+(error?error.message:(data&&data.fehler))); return; }
  await laden();
}
async function claudeAbrufen(btn){
  btn.disabled=true; btn.textContent='holt …';
  const {data,error}=await client.rpc('cb_claude_kosten_sync');
  if(error||!data||!data.ok){ btn.textContent='Fehler'; alert('Abruf fehlgeschlagen: '+(error?error.message:JSON.stringify(data).slice(0,200))); }
  await laden();
}
/* Waechter: Liste aller meldenden, Klick zeigt die Faelle (gleicher Weg wie cockpit.html). */
function popAuf(h){ $('popIn').innerHTML=h; $('pop').style.display='flex'; }
function popZu(){ $('pop').style.display='none'; }
$('pop').addEventListener('click',e=>{ if(e.target.id==='pop') popZu(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') popZu(); });
function waechterListe(){
  const wm=(D&&D.waechter&&D.waechter.melden)||[];
  popAuf('<h3><span>Wächter, die melden</span><button class="knopf" onclick="popZu()">schließen</button></h3>'
    +(wm.length ? wm.map(x=>'<button class="wl" onclick="waechterFaelle(\''+esc(x.k)+'\',\''+esc(x.name).replace(/'/g,'')+'\')"><span>'+lampe(x.gate?'alarm':'warn')+' &nbsp;'+esc(x.name)+'</span><b>'+zahl(x.n)+'</b></button>').join('')
                : '<p>Alle '+zahl(D.waechter.gesamt)+' Wächter sind still.</p>'));
}
async function waechterFaelle(k, name){
  popAuf('<h3><span>'+esc(name)+' · lädt …</span></h3>');
  const {data,error}=await client.rpc('cb_admin_cockpit_waechter_faelle',{p_key:k,p_limit:50,p_land:null});
  const zurueck='<button class="knopf" onclick="waechterListe()">zurück</button>';
  if(error||!data||!data.ok){ popAuf('<h3><span>'+esc(name)+'</span>'+zurueck+'</h3><p class="fehler">Fehler: '+esc(error?error.message:(data&&data.fehler))+'</p>'); return; }
  const rows=data.faelle||[];
  if(!rows.length){ popAuf('<h3><span>'+esc(name)+' · keine Fälle</span>'+zurueck+'</h3>'); return; }
  const cols=Object.keys(rows[0]).filter(c=>!/base64|hash|fingerprint/i.test(c)).slice(0,7);
  const fmt=v=>v==null?'':typeof v==='object'?esc(JSON.stringify(v)).slice(0,120):esc(String(v)).slice(0,120);
  popAuf('<h3><span>'+esc(name)+' · '+rows.length+' Fälle</span>'+zurueck+'</h3><div style="overflow:auto"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'
    +rows.map(r=>'<tr>'+cols.map(c=>'<td>'+fmt(r[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');
}
/* 25.10.2026, Ralph: "die aufgaben kachel fehlt aber" - zeigt die eine Aufgabenliste (cb_admin_aufgaben),
   oben die Zahlen, darunter was bei Ralph liegt (rote zuerst) mit Erledigt / Weg (cb_admin_aufgabe_setzen). */
const BEREICH={marketing:'Social Media',stamm:'Zutaten',golive:'Go-Live',scanweg:'Scannen','apple-store-app':'iPhone-App',frontend:'Webseite',unvertraeglichkeiten:'Unverträglichkeiten','agb-und-co':'Recht',eingang:'Eingang',kernvertrag:'Kernvertrag'};
async function aufgabenLaden(){
  const {data,error}=await client.rpc('cb_admin_aufgaben',{p_mit_pruefen:false});
  if(error||!Array.isArray(data)){ $('aufL').innerHTML='<div><span style="color:var(--muted)">Aufgaben gerade nicht ladbar'+(error?': '+esc(error.message):'')+'</span></div>'; return; }
  const dir=data.filter(a=>a.art==='aufgabe'&&a.status==='open'&&a.wer==='ralph');
  const chk=data.filter(a=>a.status==='ready_for_verification');
  const cl=data.filter(a=>a.status!=='ready_for_verification'&&!(a.art==='aufgabe'&&a.wer==='ralph'));
  $('aufDir').textContent=dir.length; $('aufChk').textContent=chk.length; $('aufCl').textContent=cl.length;
  dir.sort((x,y)=>(y.ampel==='rot')-(x.ampel==='rot'));
  $('aufL').innerHTML = dir.length ? dir.slice(0,6).map(a=>'<div data-id="'+esc(a.id)+'"><span>'+(a.ampel==='rot'?'<span class="rot">!</span>':'')+esc(a.titel)+'</span>'
      +'<span><button class="ok" data-a="erledigt">Erledigt</button> <button data-a="loeschen">Weg</button></span>'
      +'<small>'+esc(BEREICH[a.projekt]||a.projekt)+'</small></div>').join('')
      +(dir.length>6?'<div><small>… und '+(dir.length-6)+' weitere</small></div>':'')
    : '<div><span style="color:var(--muted)">Nichts bei dir offen.</span></div>';
}
document.addEventListener('click',async function(ev){
  const b=ev.target.closest&&ev.target.closest('#aufL button[data-a]'); if(!b) return;
  const row=b.closest('[data-id]'); row.querySelectorAll('button').forEach(x=>x.disabled=true);
  const {data,error}=await client.rpc('cb_admin_aufgabe_setzen',{p_art:'aufgabe',p_id:row.dataset.id,p_aktion:b.dataset.a});
  if(error||!data||!data.ok){ row.querySelectorAll('button').forEach(x=>x.disabled=false); alert('Nicht gespeichert: '+(error?error.message:'')); return; }
  aufgabenLaden();
});
laden(); aufgabenLaden();
setInterval(()=>{ if(!document.hidden){ laden(); aufgabenLaden(); } }, 60000);
</script>
