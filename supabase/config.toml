# Root Index - Minimalkonfiguration nur fuer Edge-Function-Deploys.
# Automatisch angelegt von Deploy-Riki.command.
# Sie regelt genau EINES: dass die Anmeldepruefung (verify_jwt)
# beim Ausliefern eingeschaltet bleibt. Ohne Eintrag entscheidet
# die CLI selbst - und darauf soll sich niemand verlassen muessen.

project_id = "haurbpfkfaaehorirzee"

[functions.riki-analyse]
verify_jwt = true

[functions.riki-herstellerseite]
verify_jwt = true

[functions.riki-quelle-lesen]
verify_jwt = true

[functions.riki-orchestrator]
verify_jwt = true

[functions.seo-search-console-sync]
verify_jwt = true

# mail-agent prueft seinen eigenen Schluessel (SHA-256 gegen
# Postfach_Agent_Schluessel), darum hier bewusst aus.
[functions.mail-agent]
verify_jwt = false

[functions.quick-import]
verify_jwt = true

[functions.stripe-checkout]
verify_jwt = false

[functions.umsatz-sync]
verify_jwt = true

[functions.hersteller-abgleich]
verify_jwt = true

# produktbild-uebernehmen wird aus der Datenbank (pg_net-Trigger) ohne
# Schluessel angestossen und nimmt keine Eingabe an – arbeitet nur die
# Tabelle produktbild_eingang ab (RLS, nur service_role). Darum bewusst aus.
[functions.produktbild-uebernehmen]
verify_jwt = false
