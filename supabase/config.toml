# Root Index - Minimalkonfiguration nur fuer Edge-Function-Deploys.
# Automatisch angelegt von Deploy-Riki.command.
# Sie regelt genau EINES: dass die Anmeldepruefung (verify_jwt)
# beim Ausliefern eingeschaltet bleibt. Ohne Eintrag entscheidet
# die CLI selbst - und darauf soll sich niemand verlassen muessen.

project_id = "haurbpfkfaaehorirzee"

[functions.riki-analyse]
verify_jwt = true

[functions.riki-herstellerseite]
verify_jwt = true

[functions.riki-quelle-lesen]
verify_jwt = true

[functions.riki-orchestrator]
verify_jwt = true

[functions.seo-search-console-sync]
verify_jwt = true

# mail-agent prueft seinen eigenen Schluessel (SHA-256 gegen
# Postfach_Agent_Schluessel), darum hier bewusst aus.
[functions.mail-agent]
verify_jwt = false

[functions.quick-import]
verify_jwt = true

[functions.stripe-checkout]
verify_jwt = false

[functions.umsatz-sync]
verify_jwt = true

[functions.appstore-sync]
verify_jwt = true

[functions.hersteller-abgleich]
verify_jwt = true

# produktbild-uebernehmen wird aus der Datenbank (pg_net-Trigger) ohne
# Schluessel angestossen und nimmt keine Eingabe an – arbeitet nur die
# Tabelle produktbild_eingang ab (RLS, nur service_role). Darum bewusst aus.
[functions.produktbild-uebernehmen]
verify_jwt = false

# newsletter-versand: nur mit Service-Schluessel (Takt/pg_net); prueft ihn selbst zusaetzlich.
[functions.newsletter-versand]
verify_jwt = true

[functions.riki-mahlzeit]
verify_jwt = true

# 01.10.2026: Apple-Abo. Apple ruft die Server-Meldungen OHNE Supabase-Anmeldung auf - die Funktion
# prueft selbst: Apple-Signatur (Root-Zertifikat) bzw. Nutzer-JWT beim Kauf aus der App.
[functions.apple-kauf]
verify_jwt = false

[functions.foldair-lizenz]
verify_jwt = false

# 05.11.2026 (#865): off-lookup liegt ab v3.3 im Repo. Wie bisher mit Anmeldepruefung
# (Web schickt Nutzer-Token oder den oeffentlichen Schluessel).
[functions.off-lookup]
verify_jwt = true

[functions.play-kauf]
verify_jwt = false

# 11.11.2026 FL-1: Fachperson schickt Einlöse-Link per E-Mail - nur angemeldet
[functions.fp-key-mail]
verify_jwt = true
