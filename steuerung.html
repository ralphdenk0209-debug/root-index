<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Root Index — Aufgaben</title>
<!--
  STEUERUNGSSEITE · zwei Zeilen, Spalten sind Projekte
  ----------------------------------------------------
  Work SG-412, neu gefasst am 02.09.2026 nach Ralph-Entscheid E34.
  Vorher: vier Ebenenzeilen (#375/#386/#387/#388/#390, E25/E30).

  E34 HAT EBENE 1 ABGESCHAFFT. Es gibt keinen Steuerungschat mehr. Deshalb
  heissen die Zeilen jetzt nach dem, was dort passiert — nicht nach einer Ebene:

  1 · Bei Ralph     Produkt- und Richtungsentscheide
  2 · Projektchat   Projektpunkte und Work Items: offen, laeuft, Abnahme, haengt

  Ein Work Item wird nur als umgesetzt gemeldet. Sind alle Items eines Punkts
  umgesetzt, meldet der Projektchat den ganzen Punkt. Erst dieser Punkt steht
  zur Abnahme. Der Server prueft Abnehmer ungleich meldender Projektchat.

  ENTSCHEIDUNGEN FUER RALPH STEHEN GANZ OBEN, ueber der Tafel, mit Nummer und
  einem Satz. Ralph soll sie sehen, ohne zu scrollen (E34).

  Die Spaltenreihenfolge ist in allen Zeilen dieselbe.

  DAS GERUEST KOMMT AUS DEM SERVER, NICHT AUS DEN AUFGABEN (#388).
  Frueher wurden die Spalten aus dem Feld "projekt" der Work-Item-Liste abgeleitet.
  Dann fehlte jedes Projekt ohne Aufgabe. Jetzt liefert
  cb_admin_agent_projektstruktur das Geruest, und die Work Items werden
  hineingehaengt. Aufgaben ohne Projektzuordnung stehen sichtbar unter ZZ.

  KEINE ZWEITE WAHRHEIT. Jede Zeile kommt aus shadow_v1.agent_work_item (E11),
  geholt ueber cb_admin_agent_work_kurzliste. Diese Seite speichert nichts eigenes.
  Geschrieben wird ausschliesslich ueber die vorhandenen Tueren:
    cb_admin_agent_work_status      (Status + Notiz)
    cb_admin_agent_work_zuweisen    (Owner, Prioritaet, Entscheid noetig)
    cb_admin_agent_work_zuordnen    (Projektaufgabe, neu in #388)
    cb_admin_agent_work_setzen      (neue Aufgabe anlegen — Karte bei Ralph, 03.09.)
    cb_admin_agent_projektaufgabe_anlegen (neuer Projektpunkt aus dem Formular, 03.09.)
    cb_admin_agent_projektaufgabe_melden      (ganzen Punkt fertig melden)
    cb_admin_agent_projektaufgabe_verifizieren(ganzen Punkt abnehmen)
  Es gibt hier keine nachgebaute Fachlogik. Der Server entscheidet (CLAUDE.md B1).

  ABNAHME (E32/E34): umgesetzt gemeldete Work Items bleiben im Projektpunkt.
  Der ganze Punkt wird in einem Durchgang von einem anderen Agenten oder Ralph
  abgenommen. Es gibt am Work Item keine Abnahmestufe mehr.

  Anmeldung: dieselbe Sitzung wie admin.html (storageKey sb-cleanbase-auth,
  gleiche Herkunft). Wer nicht angemeldet ist, sieht den Hinweis statt der Tafel.
-->
<style>
:root{
  --bg:#0e1116; --bg2:#151a21; --karte:#1b222c; --karte2:#222b37;
  --linie:#2c3542; --text:#e7edf5; --schwach:#93a1b3;
  --st1:#7c5cff; --st2:#00b3a4; --st3:#4a90d9; --st0:#d18f2f;
  --offen:#5b6b7f; --laeuft:#3d7fd1; --abnahme:#c9922b; --haengt:#d1493d; --fertig:#3fa34d;
  --e2:#c9922b; --e1:#b06fd1; --e0:#e0b341;
  --schatten:0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:#8ab4f8}

/* ---------- Kopf ---------- */
.kopf{position:sticky;top:0;z-index:40;background:var(--bg2);
  border-bottom:1px solid var(--linie);padding:10px 16px}
.kopf-zeile{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kopf h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
.kopf .stand{color:var(--schwach);font-size:12px}
.spacer{flex:1}
button,select,input{font:inherit;color:var(--text);background:var(--karte);
  border:1px solid var(--linie);border-radius:7px;padding:5px 9px}
button{cursor:pointer}
button:hover{background:var(--karte2)}
button.haupt{background:#2f6fd0;border-color:#2f6fd0;font-weight:600}
button.haupt:hover{background:#3a7ee0}
button:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
  border:1px solid var(--linie);color:var(--schwach);white-space:nowrap}

/* ---------- Einfache Aufgabenliste ---------- */
.aufgaben{max-width:1080px;margin:0 auto;padding:18px 16px 44px}
.aufgaben-leiste{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.aufgaben-leiste h2{margin:0;font-size:16px}
.aufgaben-leiste .erklaerung{color:var(--schwach);font-size:12px}
.aufgaben-block{margin:0 0 16px;border:1px solid var(--linie);border-radius:11px;overflow:hidden;background:var(--bg2)}
.aufgaben-block-kopf{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--linie)}
.aufgaben-block-kopf i{width:9px;height:9px;border-radius:99px;flex:none}
.aufgaben-block-kopf h3{margin:0;font-size:13px}
.aufgaben-block-kopf span{margin-left:auto;color:var(--schwach);font-size:12px}
.aufgaben-liste{display:flex;flex-direction:column}
button.aufgabe{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px 11px;border:0;border-radius:0;border-bottom:1px solid var(--linie);background:transparent;text-align:left;color:var(--text)}
button.aufgabe:last-child{border-bottom:0}
button.aufgabe:hover{background:var(--karte)}
.aufgabe .aufgabe-id{font-size:12px;font-weight:800;color:var(--akzent);font-variant-numeric:tabular-nums}
.aufgabe .aufgabe-titel{font-size:13px;line-height:1.35;font-weight:650}
.aufgabe .aufgabe-meta{margin-top:3px;color:var(--schwach);font-size:11.5px}
.aufgabe .aufgabe-prio{font-size:11px;color:var(--schwach);white-space:nowrap}
.keine-aufgaben{padding:26px 12px;color:var(--schwach);text-align:center}
@media(max-width:600px){button.aufgabe{grid-template-columns:58px minmax(0,1fr)}.aufgabe .aufgabe-prio{display:none}}

/* ---------- Zaehlerband ---------- */
.band{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.zaehler{background:var(--karte);border:1px solid var(--linie);border-radius:8px;
  padding:5px 10px;font-size:12px;color:var(--schwach)}
.zaehler b{color:var(--text);font-size:15px;margin-right:5px}

/* ---------- Zeilen ---------- */
.tafel{padding:14px 16px 40px}
.stock{margin-bottom:16px;border:1px solid var(--linie);border-radius:11px;
  background:var(--bg2);overflow:hidden}
.stock-kopf{display:flex;align-items:center;gap:10px;padding:9px 12px;flex-wrap:wrap;
  border-bottom:1px solid var(--linie);
  background:linear-gradient(90deg,var(--akzent) 0 4px,transparent 4px)}
.stock-kopf .punkt{width:9px;height:9px;border-radius:99px;background:var(--akzent);flex:none}
.stock-kopf h2{margin:0;font-size:14px;font-weight:650}
.stock-kopf .regel{color:var(--schwach);font-size:11.5px}
.stock-koerper{display:grid;gap:1px;background:var(--linie)}
.spalte{background:var(--bg2);min-height:64px;padding:8px}
.spalte-kopf{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.spalte-kopf .kz{font-size:10.5px;font-weight:800;letter-spacing:.6px;
  background:var(--karte2);border:1px solid var(--linie);border-radius:5px;padding:0 5px;flex:none}
.spalte-kopf .name{font-size:11.5px;color:var(--schwach);font-weight:600;
  text-transform:uppercase;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spalte-kopf .n{margin-left:auto;font-size:12px;color:var(--text);font-weight:700}

/* ---------- Zeile 1: Projektkarten ---------- */
.pkarte{background:var(--karte);border:1px solid var(--linie);border-top:3px solid var(--pf);
  border-radius:9px;padding:9px 10px;box-shadow:var(--schatten);margin-bottom:9px}
.pkarte .kopfz{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* ---------- Zielzahl neben dem Titel · Farbskala (Ralph, 02.09.) ---------- */
.zielbadge{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;
  border:1px solid;border-radius:7px;padding:2px 7px 3px;min-width:74px;line-height:1.15}
.zielbadge b{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.zielbadge i{font-style:normal;font-size:9.5px;opacity:.85;white-space:nowrap}
.zielbalken{display:block;width:100%;height:3px;margin-top:3px;border-radius:99px;
  background:rgba(255,255,255,.14);overflow:hidden}
.zielbalken span{display:block;height:100%;border-radius:99px}

/* ---------- Eingeklapptes Projekt · schmaler Streifen, nicht entfernt ---------- */
.spalte.schmal{display:flex;align-items:center;justify-content:center;padding:6px 0;
  cursor:pointer;background:linear-gradient(180deg,var(--karte),var(--bg2))}
.spalte.schmal:hover{background:var(--karte2)}
.spalte.schmal .kz-hoch{writing-mode:vertical-rl;transform:rotate(180deg);
  font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:var(--schwach)}
.pkarte .kz{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--text);
  background:var(--karte2);border:1px solid var(--linie);border-radius:5px;padding:0 5px}
.pkarte h3{margin:0;font-size:13.5px;font-weight:700}
.pkarte .lauf{font-size:11px;color:var(--schwach);margin:3px 0 6px}
.pkarte .was{font-size:11.5px;color:var(--schwach);line-height:1.4;margin-bottom:5px}
.pkarte .ziel{font-size:11.5px;line-height:1.4;margin-bottom:7px;
  border-left:2px solid var(--fertig);padding-left:6px;color:#c6d4e4}
.pkarte .ziel b{color:var(--schwach);font-weight:600;text-transform:uppercase;
  font-size:9.5px;letter-spacing:.4px;display:block}
.pkarte .zahlen{display:flex;gap:5px;flex-wrap:wrap}
.zbox{flex:1 1 auto;min-width:40px;text-align:center;border:1px solid var(--linie);
  border-radius:6px;padding:3px 2px;background:var(--bg2)}
.zbox b{display:block;font-size:15px;line-height:1.2}
.zbox span{font-size:9.5px;color:var(--schwach);text-transform:uppercase;letter-spacing:.3px}
.pkarte .wartet{margin-top:7px;font-size:11px;color:var(--schwach)}
.pkarte .wartet b{color:var(--haengt)}

/* ---------- Zeile 2: Projektaufgaben ---------- */
.paufgabe{display:flex;align-items:center;gap:6px;background:var(--karte);
  border:1px solid var(--linie);border-radius:7px;padding:5px 8px;margin-bottom:5px}
.paufgabe .ampel{width:8px;height:8px;border-radius:2px;flex:none}
.paufgabe{cursor:pointer}
.paufgabe:hover{background:var(--karte2)}
.paufgabe.auf{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0;
  border-bottom-color:transparent}
.paufgabe .panr{font-size:10.5px;font-weight:800;letter-spacing:.4px;flex:none;
  background:var(--karte2);border:1px solid var(--linie);border-radius:5px;padding:0 4px}
/* Ralph, 03.09.: „etwas hoeher darstellen, weil Text abgeschnitten wird".
   Der Titel darf jetzt zwei Zeilen haben; der Stand rutscht bei Platznot in
   die naechste Zeile statt den Titel auf „E…" zu kuerzen. */
.paufgabe{flex-wrap:wrap;row-gap:2px}
.paufgabe .t{font-size:12px;line-height:1.3;flex:1 1 120px;min-width:0;
  white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* Aufgeklappt zeigt jeder Text seine ganze Laenge (Ralph, 02.09.: „beim
   aufklappen soll der komplette text sichtbar sein") */
.paufgabe.auf .t{white-space:normal;overflow:visible;text-overflow:clip;display:block;-webkit-line-clamp:unset}
.paufgabe.auf{align-items:flex-start}
.pa-auf .pa-item{align-items:flex-start}
.pa-auf .pa-item .pit{white-space:normal;overflow:visible;text-overflow:clip}
.pa-auf .pa-item .pis{white-space:nowrap}
.paufgabe .n{margin-left:auto;font-size:11px;color:var(--schwach);flex:none}
/* Kette (#412): Verbindungslinie links, Marker am naechsten Punkt */
.kette-kopf{font-size:9.5px;color:var(--schwach);text-transform:uppercase;letter-spacing:.4px;margin:8px 0 4px}
.kette{position:relative;padding-left:12px}
.kette::before{content:"";position:absolute;left:3px;top:10px;bottom:14px;width:2px;background:var(--linie)}
.kette .paufgabe.inkette{position:relative}
.kette .paufgabe.inkette::before{content:"";position:absolute;left:-12px;top:50%;width:8px;height:2px;background:var(--linie)}
.kette .paufgabe.inkette:not(.letzter)::after{content:"▼";position:absolute;left:-14px;bottom:-9px;font-size:8px;color:var(--schwach);line-height:1}
.paufgabe.hier{border-color:var(--laeuft);box-shadow:inset 0 0 0 1px var(--laeuft)}
.paufgabe .pa-stand{margin-left:auto;font-size:10.5px;color:var(--schwach);flex:none;white-space:nowrap}
.paufgabe .pa-stand.hier{color:var(--laeuft);font-weight:700}
.paufgabe .pfeil{font-size:9px;color:var(--schwach);flex:none}
.pa-auf{background:var(--bg2);border:1px solid var(--linie);border-top:0;
  border-radius:0 0 7px 7px;padding:7px 8px 8px;margin-bottom:5px}
.pa-feld{margin-bottom:7px;font-size:11.5px;line-height:1.45;color:#c6d4e4}
.pa-feld:last-child{margin-bottom:0}
.pa-feld b{display:block;font-size:9.5px;color:var(--schwach);text-transform:uppercase;
  letter-spacing:.4px;margin-bottom:2px}
.pa-feld .fehlt{color:#5a6675;font-style:italic}
.pa-items{display:flex;flex-direction:column;gap:3px}
.pa-item{display:flex;align-items:center;gap:5px;cursor:pointer;padding:2px 3px;border-radius:5px}
.pa-item:hover{background:var(--karte2)}
.pa-item .ampel{width:7px;height:7px;border-radius:2px;flex:none}
.pa-item .pinr{font-size:10.5px;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.pa-item .pit{font-size:11px;color:var(--schwach);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pa-item .pis{margin-left:auto;font-size:10px;color:var(--schwach);flex:none}
.pa-aktionen{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.pa-aktionen button{font-size:11px;padding:4px 7px}
.pa-status{font-size:10px;color:var(--schwach);margin-left:auto;flex:none}
.punktkarte{cursor:default}
.punktkarte .fuss button{font-size:10.5px;padding:2px 6px}

/* ---------- Zeile 3: Stationsgruppen ---------- */
.gruppe{margin-bottom:9px}
.gruppe-kopf{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.gruppe-kopf .ampel{width:8px;height:8px;border-radius:2px;flex:none}
.gruppe-kopf .gname{font-size:11px;color:var(--schwach);font-weight:600}
.gruppe-kopf .gn{margin-left:auto;font-size:11px;color:var(--schwach)}
.stapel{display:flex;flex-direction:column;gap:5px;min-height:26px;border-radius:7px}
.stapel.ziel{outline:2px dashed var(--laeuft);outline-offset:2px;background:rgba(61,127,209,.07)}
.karte{background:var(--karte);border:1px solid var(--linie);border-left:3px solid var(--kf);
  border-radius:7px;padding:6px 8px;cursor:grab;box-shadow:var(--schatten)}
.karte:hover{background:var(--karte2)}
.karte:active{cursor:grabbing}
.karte.zieht{opacity:.4}
.karte .zeile1{display:flex;gap:6px;align-items:baseline}
.karte .id{font-variant-numeric:tabular-nums;color:var(--text);font-size:11px;
  font-weight:700;letter-spacing:.3px;flex:none}
.karte .prio{margin-left:auto;font-size:11px;font-weight:700;color:var(--schwach);flex:none}
.karte .titel{font-size:12.5px;line-height:1.35;margin:2px 0 4px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.karte .fuss{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.karte.warn{border-left-color:var(--haengt)}
.chip.stufe{border-color:var(--sf);color:var(--sf);font-weight:700}
.mehr{background:none;border:1px dashed var(--linie);color:var(--schwach);
  font-size:11.5px;padding:4px;border-radius:7px;width:100%}
.leer{color:#5a6675;font-size:11.5px;padding:4px 2px}
.buendel{width:100%;margin-bottom:7px;font-size:11.5px;padding:4px}


/* ---------- Karte als Popup in der Mitte (Ralph, 03.09.) ----------
   Vorher ein Seitenpanel rechts. Jetzt eine Karte: vier Rubriken, je hoechstens
   drei Kurzsaetze. Wer mehr geschrieben hat, sieht „+ n weitere" - der Rest
   bleibt lesbar, aber nicht im Weg. */
.panel{position:fixed;left:50%;top:50%;width:min(560px,94vw);max-height:90vh;
  background:var(--bg2);border:1px solid var(--linie);border-radius:14px;
  box-shadow:0 18px 60px rgba(0,0,0,.55);z-index:60;
  transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;
  transition:transform .14s ease,opacity .14s ease;display:flex;flex-direction:column}
.panel.auf{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.panel-kopf{padding:12px 14px;border-bottom:1px solid var(--linie);display:flex;gap:8px;align-items:flex-start}
.panel-koerper{padding:14px;overflow:auto;flex:1}
.panel h3{margin:0 0 3px;font-size:14px;line-height:1.35}
.feld{margin-bottom:12px}
.feld label{display:block;font-size:11.5px;color:var(--schwach);margin-bottom:4px;
  text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.feld select,.feld input,.feld textarea{width:100%}
textarea{background:var(--karte);border:1px solid var(--linie);border-radius:7px;
  padding:7px;min-height:74px;resize:vertical;font:inherit;color:var(--text)}
.panel-fuss{padding:12px 14px;border-top:1px solid var(--linie);display:flex;gap:8px}
.meldung{font-size:12px;padding:7px 9px;border-radius:7px;margin-bottom:10px;display:none}
.meldung.gut{display:block;background:#14331d;border:1px solid #2c6b3c;color:#a8e6b8}
.meldung.schlecht{display:block;background:#3a1a17;border:1px solid #7a332c;color:#f0b4ad}
.abdeckung{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
.abdeckung.auf{display:block}
.weg{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--schwach);margin-bottom:10px}
.weg span{border:1px solid var(--linie);border-radius:99px;padding:1px 7px}
.weg span.jetzt{border-color:var(--abnahme);color:var(--abnahme);font-weight:700}
.weg span.durch{border-color:var(--fertig);color:var(--fertig)}
/* Naechster Schritt (Ralph, 05.09.: „was heisst das, was muss ich tun?") */
.schritt{border:1px solid var(--st0);border-left:4px solid var(--st0);border-radius:9px;padding:9px 11px;margin-bottom:12px;background:var(--karte)}
.schritt b{display:block;font-size:9.5px;color:var(--schwach);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.schritt .wer{font-weight:700;color:var(--st0)}
.schritt p{margin:2px 0 0;font-size:12.5px;line-height:1.45}
.schritt button{margin-top:7px;font-weight:700}
.schritt.ruhig{border-color:var(--linie);border-left-color:var(--schwach)}
.schritt.ruhig .wer{color:var(--text)}

/* Aufgabentext im Panel (#397) */
.ptext{margin-bottom:14px}
.ptext .block{background:var(--karte);border:1px solid var(--linie);border-radius:8px;
  padding:8px 10px;margin-bottom:8px}
.ptext .block b{display:block;font-size:9.5px;color:var(--schwach);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:3px}
.ptext .block p{margin:0;font-size:12.5px;line-height:1.5;white-space:pre-wrap}
.ptext .block.stand{border-left:3px solid var(--laeuft)}
.ptext .block.fertig{border-left:3px solid var(--fertig)}
.ptext .leerfeld{color:#5a6675;font-style:italic}
.ptext .laedt{color:var(--schwach);font-size:12px;padding:4px 2px}
/* Vier Rubriken als Stichpunkte (Ralph, 03.09.) */
.ptext .rubriken{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ptext .block.warum{border-left:3px solid var(--haengt)}
.ptext .block.fehlt{border-left:3px solid var(--laeuft)}
.ptext .block ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.45}
.ptext .block li{margin:0 0 3px}
.ptext .block li:last-child{margin-bottom:0}
.ptext .mehr{display:inline-block;margin-top:4px;font-size:11px;color:var(--st0);cursor:pointer;background:none;border:none;padding:0}
.ptext .block.zu li.rest{display:none}

<script>
/* ============================================================
   1 · Verbindung — dieselbe Sitzung wie das Dashboard
   ============================================================ */
const SUPABASE_URL = "https://haurbpfkfaaehorirzee.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhdXJicGZrZmFhZWhvcmlyemVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDY2OTYsImV4cCI6MjA5Nzk4MjY5Nn0.6U0bD0m2kYM2iL0KJ9fbCFvcQMXAglr8GvwmPwyHqyw";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true,
         storage: window.localStorage, storageKey:"sb-cleanbase-auth" }
});

/* 06.09.2026: Der Kernfluss oben wurde bereits gezeichnet - jetzt holt er seine
   Zahlen aus der Datenbank statt aus der JS-Datei (cb_kern_poster_stand). */
try{ if(window.KERN_FLUSS && KERN_FLUSS.messen)
       KERN_FLUSS.messen(client, document.getElementById("kernFluss")); }catch(e){}

/* 🔴 07.09.2026 (#613): Die Aufgaben an den Karten kommen aus der Datenbank
   (cb_admin_kern_poster_karten_work), nicht mehr aus kern-fluss.js. */
try{ if(window.KERN_FLUSS && KERN_FLUSS.aufgaben)
       KERN_FLUSS.aufgaben(client, document.getElementById("kernFluss"))
         .then(kernwegKurz); }catch(e){}

/* Klick auf eine Karte filtert die Aufgabenliste darunter. Klick auf eine
   Aufgabe an der Karte öffnet dasselbe Panel wie in der Liste — kein zweiter
   Weg, keine nachgebaute Ansicht (CLAUDE.md A4). */
let KARTE_FILTER = null;          /* {kasten_id, titel, work_ids} oder null */
(function(){
  const kf = document.getElementById("kernFluss");
  if(!kf) return;
  kf.addEventListener("kf:karte", ev => {
    KARTE_FILTER = ev.detail && ev.detail.kasten_id ? ev.detail : null;
    if(typeof zeichnen === "function") zeichnen();
  });
  kf.addEventListener("kf:work", ev => {
    const id = ev.detail && ev.detail.work_id;
    if(id && typeof panelAuf === "function") panelAuf(Number(id));
  });
})();

/* Die Kopfzeile der Sektion sagt, wie viele Karten offene Aufgaben tragen —
   eine Überschrift ohne Zahl ist eine Behauptung (A2). */
function kernwegKurz(){
  const k = document.getElementById("kwKurz");
  if(!k || !window.KERN_FLUSS || !KERN_FLUSS.werJeKarte) return;
  const je = KERN_FLUSS.werJeKarte() || {};
  const karten = KERN_FLUSS.KNOTEN.length;
  const mit = Object.keys(je).length;
  const aufg = new Set(); Object.values(je).forEach(l => l.forEach(x => aufg.add(x.work_id)));
  k.textContent = karten + " Karten · " + mit + " davon mit offener Aufgabe · "
    + aufg.size + " Aufgaben, alle aus der Datenbank";
}

/* ============================================================
   2 · Die Stationen — Work Items werden gebaut, Projektpunkte abgenommen
   ============================================================ */
const STATIONEN = [
  { id:"open",        name:"offen",           farbe:"var(--offen)"  },
  { id:"in_progress", name:"läuft",           farbe:"var(--laeuft)" },
  { id:"umgesetzt",   name:"umgesetzt gemeldet", farbe:"var(--abnahme)" },
  { id:"entscheid_e0",name:"Ralph entscheidet",  farbe:"var(--haengt)" },
  { id:"haengt",      name:"hängt",           farbe:"var(--haengt)" }
];
/* „hängt" ist die Sammelspalte der Zeile In Arbeit. Ralph entscheidet gehoert
   NICHT dazu: solche Karten stehen bei Ralph in Zeile 1, sonst stuenden sie doppelt
   auf der Tafel — und eine Karte an zwei Stellen ist eine zweite Wahrheit. */
const HAENGT = ["blocked","disputed"];
function stationVon(w){
  if(w.status==="decision_ralph") return "entscheid_e0";
  if(HAENGT.indexOf(w.status)>=0) return "haengt";
  if(w.status==="ready_for_verification") return "umgesetzt";
  return w.status;
}
function stationFarbe(id){
  const s = STATIONEN.find(x=>x.id===id); return s ? s.farbe : "var(--offen)";
}

/* Reihenfolge in der Spalte: was Ralph stoppt steht oben. */
const STOPP_RANG = { decision_ralph:0, blocked:1, disputed:2,
                     ready_for_verification:3, open:4, in_progress:5 };

/* ============================================================
   3 · Laden — Geruest vom Server, Aufgaben hineingehaengt (#388)
   ============================================================ */
let ZEILEN = [];
let PROJEKTE = [];          /* die Spaltenreihenfolge, in allen Zeilen gleich */
let PAUFGABEN = {};         /* projekt_id -> Projektpunkte samt Serverstatus */
let WORK_AUFGABE = {};      /* work_id -> aufgabe_id */
let MESSWERTE = {};         /* projekt_id -> automatische E24-Zielzahl (#431) */
let OFFEN_STAPEL = {};
let AKTUELL = null;
let STRUKTUR_FEHLT = false;

const $ = id => document.getElementById(id);
const OHNE_ID = "_ohne";

async function laden(){
  $("stand").textContent = "misst …";
  const { data:{ session } } = await client.auth.getSession();
  if(!session){ nichtAngemeldet(); return; }

  const [rk, rs, rp, rm, rmp] = await Promise.all([
    client.rpc("cb_admin_agent_work_kurzliste",
      { p_status:["open","in_progress","ready_for_verification","blocked","disputed","decision_ralph"],
        p_owner:null, p_bereich:null, p_limit:500 }),
    client.rpc("cb_admin_agent_projektstruktur"),
    client.rpc("cb_admin_agent_projektaufgaben_kurzliste"),
    client.rpc("cb_admin_agent_projekt_messsicht"),
    client.rpc("cb_admin_kern_poster_marschplan")   /* #643 */
  ]);
  marschplanZeichnen(rmp);
  if(rk.error){ fehlerZeigen(rk.error.message||String(rk.error)); return; }
  if(rp.error){ fehlerZeigen(rp.error.message||String(rp.error)); return; }

  let rows = rk.data; if(typeof rows==="string") rows = JSON.parse(rows);
  if(!Array.isArray(rows)){ fehlerZeigen("Die Liste kam nicht als Liste zurück."); return; }

  ZEILEN = rows.map(w => Object.assign({}, w, {
    _projekt: w.projekt || OHNE_ID,
    _kuerzel: w.projekt_kuerzel || "ZZ",
    _nummer:  w.anzeige_nummer || ("#"+w.work_id),
    _station: stationVon(w)
  }));

  geruestBilden(rs, rp, rm);
  filterFuellen();
  zuordnungFuellen();
  zeichnen();
  $("stand").textContent = "Stand " + new Date().toLocaleString("de-DE",
    {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) +
    " · " + ZEILEN.length + " Aufgaben · " + PROJEKTE.length + " Projekte";
}

/* Work #643: der Weg zum gruenen Kern-Poster.
   Faellt die Messung aus, steht das da - keine erfundene Zahl (CLAUDE.md A2). */
function marschplanZeichnen(r){
  const kurz = $("mpKurz"), ziel = $("mpTabelle");
  if(!kurz || !ziel) return;
  if(!r || r.error || !Array.isArray(r.data)){
    kurz.textContent = "nicht messbar";
    ziel.innerHTML = '<div style="padding:10px;opacity:.8">Der Marschplan kam nicht zurück' +
      (r && r.error ? ': ' + (r.error.message||String(r.error)) : '') + '.</div>';
    return;
  }
  const z = r.data;
  const gruen = z.filter(x => x.ampel === 'gruen').length;
  /* #644: die Zahlen kommen aus dem getakteten Cache. Wie alt sie sind, steht
     dabei - sonst sieht eine Zahl von gestern aus wie eine von jetzt (A3). */
  const alt = z.length ? z[0].alter_minuten : null;
  const altText = alt == null ? "" :
    (alt < 1 ? " · eben gemessen" :
     alt < 60 ? " · vor " + alt + " Min gemessen" :
     " · ⚠ Messung " + Math.round(alt/60) + " Std alt");
  kurz.textContent = gruen + " von " + z.length + " Kästen grün" + altText;

  const farbe = a => a==='gruen' ? '#2e7d32' : a==='rot' ? '#b3261e' : '#9a6a00';
  let h = '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
    '<tr style="text-align:left;opacity:.75">' +
    '<th style="padding:4px 6px">Rang</th><th style="padding:4px 6px">Kasten</th>' +
    '<th style="padding:4px 6px;text-align:right">offen</th>' +
    '<th style="padding:4px 6px">Aufgabe</th><th style="padding:4px 6px">Takt</th>' +
    '<th style="padding:4px 6px">Weg</th></tr>';
  for(const x of z){
    const nr = x.work_id ? ('#'+x.work_id + (x.work_status ? ' · '+x.work_status : '')) : '—';
    h += '<tr style="border-top:1px solid rgba(128,128,128,.25)">' +
      '<td style="padding:5px 6px">' + (x.arbeitsrang ?? '') + '</td>' +
      '<td style="padding:5px 6px"><b style="color:' + farbe(x.ampel) + '">● </b>' + esc(x.titel) + '</td>' +
      '<td style="padding:5px 6px;text-align:right;font-variant-numeric:tabular-nums"><b>' + x.ist + '</b></td>' +
      '<td style="padding:5px 6px;white-space:nowrap">' + esc(nr) + '</td>' +
      '<td style="padding:5px 6px;opacity:.8">' + esc(x.laeuft_takt || '—') + '</td>' +
      '<td style="padding:5px 6px;opacity:.85">' + esc(x.weg || '') + '</td></tr>';
  }
  ziel.innerHTML = h + '</table>';
}

/* Das Geruest kommt aus cb_admin_agent_projektstruktur. Ein Projekt ohne
   Aufgabe bleibt sichtbar — genau das war der Fehler in #388. Faellt die
   Struktur aus, wird sie NICHT aus den Aufgaben erraten (CLAUDE.md A2). */
function geruestBilden(rs, rp, rm){
  PROJEKTE = []; PAUFGABEN = {}; WORK_AUFGABE = {}; MESSWERTE = {};
  STRUKTUR_FEHLT = !!(rs && rs.error) || !!(rp && rp.error) || !!(rm && rm.error);
  if(STRUKTUR_FEHLT) return;

  let str = rs && rs.data; if(typeof str==="string") str = JSON.parse(str);
  let punkte = rp && rp.data; if(typeof punkte==="string") punkte = JSON.parse(punkte);
  let mess = rm && rm.data; if(typeof mess==="string") mess = JSON.parse(mess);
  if(!Array.isArray(str) || !Array.isArray(punkte) || !Array.isArray(mess)){ STRUKTUR_FEHLT = true; return; }
  MESSWERTE = Object.fromEntries(mess.map(m=>[m.projekt_id,m]));
  const punktVon = Object.fromEntries(punkte.map(a=>[a.aufgabe_id,a]));

  const gesehen = {};
  for(const z of str){
    if(!gesehen[z.projekt_id]){
      gesehen[z.projekt_id] = true;
      PROJEKTE.push({ id:z.projekt_id, name:z.projekt_name, kuerzel:z.projekt_kuerzel,
                      beschreibung:z.projekt_beschreibung, ziel:z.projekt_ziel,
                      status:z.projekt_status, reihenfolge:z.projekt_reihenfolge });
      PAUFGABEN[z.projekt_id] = [];
    }
    if(z.projekt_aufgabe_id && !PAUFGABEN[z.projekt_id].some(a=>a.aufgabe_id===z.projekt_aufgabe_id)){
      /* zweck und fertig_kriterium kommen aus #395. Liefert der Server sie noch
         nicht, bleiben sie leer — die Karte sagt das dann offen (CLAUDE.md A2). */
      const s = punktVon[z.projekt_aufgabe_id] || {};
      PAUFGABEN[z.projekt_id].push({ aufgabe_id:z.projekt_aufgabe_id, nummer:z.projekt_aufgabe_nummer,
                                     reihenfolge:z.aufgabe_reihenfolge,
                                     titel:z.projekt_aufgabe_titel, ampel:z.ampel,
                                     status:s.status || "open", owner_agent:s.owner_agent || null,
                                     verifier_agent:s.verifier_agent || null,
                                     result_note:s.result_note || null,
                                     verification_note:s.verification_note || null,
                                     updated_at:s.updated_at || null,
                                     zweck:z.zweck || null, fertig_kriterium:z.fertig_kriterium || null });
    }
    if(z.work_id && z.projekt_aufgabe_id) WORK_AUFGABE[z.work_id] = z.projekt_aufgabe_id;
  }

  /* Ein Projekt mit laufender Arbeit steht vor einem ohne; „Ohne Zuordnung" immer zuletzt. */
  const zahl = id => {
    const r = ZEILEN.filter(w=>w._projekt===id);
    return { laeuft: r.filter(w=>w.status==="in_progress").length, n: r.length };
  };
  PROJEKTE.sort((a,b)=>{
    if(a.id===OHNE_ID) return 1; if(b.id===OHNE_ID) return -1;
    const A=zahl(a.id), B=zahl(b.id);
    return (B.laeuft>0)-(A.laeuft>0) || B.n-A.n ||
           (a.reihenfolge||99)-(b.reihenfolge||99) || a.name.localeCompare(b.name,"de");
  });
}

function projektVon(id){ return PROJEKTE.find(p=>p.id===id) || null; }

/* Die Anzeigenummer einer anderen Aufgabe. Ist sie schon abgenommen, wird sie
   gar nicht geladen — dann bleibt die nackte Nummer, weil das Kuerzel fehlt
   und nicht geraten wird (CLAUDE.md A2). */
function nummerVon(id){
  const w = ZEILEN.find(x=>x.work_id===id);
  return w ? w._nummer : ("#"+id);
}

/* Projektaufgabe in Klarschrift: KP-3 statt scanweg-r3 (#387). Findet die
   Aufgabe im Geruest nichts, bleibt der interne Name stehen — nicht geraten. */
function aufgabeNummerVon(aufgabeId){
  for(const p of PROJEKTE){
    const a = (PAUFGABEN[p.id]||[]).find(x=>x.aufgabe_id===aufgabeId);
    if(a) return (p.kuerzel && a.nummer) ? (p.kuerzel+"-"+a.nummer+" · "+(a.titel||"")) : aufgabeId;
  }
  return aufgabeId;
}

function filterFuellen(){

function zuordnungFuellen(){

    h += '<optgroup label="'+esc(p.kuerzel+" · "+p.name)+'">';
    for(const a of PAUFGABEN[p.id]){
      h += '<option value="'+esc(a.aufgabe_id)+'">'+esc((a.nummer?a.nummer+" ":"")+(a.titel||a.aufgabe_id))+'</option>';

function gefiltert(){
  const t = $("fThema").value, o = $("fOwner").value;
  const st = $("fStatus").value, q = $("fSuche").value.trim().toLocaleLowerCase("de");
  /* #613: Ist oben eine Karte gewählt, zeigt die Liste nur deren Aufgaben. */
  const kf = KARTE_FILTER ? new Set(KARTE_FILTER.work_ids.map(Number)) : null;
  return ZEILEN.filter(w => (!kf || kf.has(Number(w.work_id))) &&
    (!t || w.area===t) && (!o || w.owner_agent===o) &&
    (!st || w._station===st) && (!q ||
      [w._nummer,w.title,w.area,w.owner_agent,w.projekt,w.projekt_kuerzel]
        .some(x=>String(x||"").toLocaleLowerCase("de").includes(q))));
}

   5 · Zeichnen — zwei Zeilen, gleiche Spaltenreihenfolge

/* 05.09.2026, #538, Ralph-Entscheid A: Swimlane-Tafel wiederhergestellt.
   Ein zweiter Chat hatte diese Funktion um 08:44 durch eine schlichte
   Aufgabenliste ersetzt - ohne Auftrag und ohne Sicherung. Dabei blieben
   ebeneZeile, stapelHtml, ralphBlockZeichnen und die Projektspalten als
   toter Code stehen; die Seite konnte sie nur nicht mehr erreichen.
   Fremdfassung: bereiche/_sicherungen/2026-09-05-steuerung-fremdfassung-0844/ */
function zeichnen(){
  const rows = gefiltert();

  /* Zaehlerband */
  const z = STATIONEN.map(s=>{
    const n = rows.filter(w=>w._station===s.id).length;
    return '<div class="zaehler"><b>'+n+'</b>'+esc(s.name)+'</div>';
  }).join("");
  const abnahmePunkte = Object.values(PAUFGABEN).flat()

  $("band").innerHTML = z +
    (KARTE_FILTER ? '<div class="zaehler" id="kfWeg" style="border-color:#2563eb;cursor:pointer" ' +
      'title="Filter aufheben"><b>Karte</b>' + esc(KARTE_FILTER.titel||"") + ' ✕</div>' : '') +
    '<div class="zaehler"><b>'+abnahmePunkte.length+'</b>Projektpunkte zur Abnahme</div>' +
    '<div class="zaehler"><b>'+rows.length+'</b>Aufgaben sichtbar</div>' +
    (abnahmeAlt ? '<div class="zaehler" style="border-color:#7a5a1c"><b>'+abnahmeAlt+
      '</b>warten länger als 2 Tage</div>' : '');

  if(STRUKTUR_FEHLT){
    $("luecke").style.display = "";
    $("luecke").innerHTML = '<b>Das Gerüst fehlt.</b> ' +
      'Eine Tür für Projektgerüst oder Zielzahlen hat nicht geantwortet — ' +
      'deshalb stehen keine Spalten. Erraten wird nichts (CLAUDE.md A2).';
  } else {
    $("luecke").style.display = "none";
  }

  /* Ein Projekt ohne offene Aufgabe wird eingeklappt, nicht entfernt (Ralph,
     02.09.). Es behaelt seine Spalte, aber nur noch als schmaler Streifen mit
     Kuerzel. Ein Klick klappt es wieder auf; die Wahl haelt bis zum Neuladen.
     Grund, gemessen am 02.09.: 6 von 14 Projekten hatten null offene Aufgaben
     und belegten volle Spalten — man scrollte an Leerem vorbei. */
  const leerProjekt = p => rows.filter(w=>w._projekt===p.id).length === 0;
  const eingeklappt = p => leerProjekt(p) && !OFFEN_STAPEL["spalte|"+p.id];
  const spalten = "grid-template-columns:" +
    (PROJEKTE.length
      ? PROJEKTE.map(p => eingeklappt(p) ? "38px" : "minmax(210px,1fr)").join(" ")
      : "1fr");
  const nEingeklappt = PROJEKTE.filter(eingeklappt).length;
  let html = "";

  /* Die Tafel hat zwei Zeilen. Abnahme liegt seit E32 am Projektpunkt; die
     Projektpunkte bleiben in derselben Projektchat-Zeile sichtbar. */
  const nPA = Object.values(PAUFGABEN).reduce((a,b)=>a+b.length,0);
  const je = (pid, f) => rows.filter(w=>w._projekt===pid && f(w));
  const punkteJe = (pid, f) => (PAUFGABEN[pid]||[]).filter(f);

  /* --- Zeile 1 · Bei Ralph: Produkt- und Richtungsentscheide --- */
  html += ebeneZeile({
    akzent:"var(--st0)", titel:"1 · Bei Ralph",
    regel:"Produkt, Fachlichkeit, Priorität oder Ausnahme entscheiden.",
    chips:[ zaehlChip(rows, w=>w._station==="entscheid_e0", "zu entscheiden"),
            leerChip(nEingeklappt) ],
    spalten, eingeklappt,
    zaehler: p => je(p.id, w=>w._station==="entscheid_e0").length,
    inhalt: p => stapelHtml(p, "entscheid_e0", je(p.id, w=>w._station==="entscheid_e0"), "nichts bei Ralph")
  });

  /* --- Zeile 2 · Projektchat: zerlegen, bauen und Projektpunkte abnehmen --- */
  const inArbeit = rows.filter(w=>["open","in_progress","haengt","umgesetzt"].indexOf(w._station)>=0);
  html += ebeneZeile({
    akzent:"var(--st2)", titel:"2 · Projektchat",
    regel:"Der Projektchat zerlegt und baut; ganze Projektpunkte werden hier abgenommen. " +
          "Karte in eine andere Station ziehen setzt die Station, " +
          "innerhalb einer Station die Priorität. Nach oben kommt eine Karte nur durch Abnehmen.",
    chips:[ '<span class="chip">'+abnahmePunkte.length+' Projektpunkte zur Abnahme</span>',
            '<span class="chip">'+PROJEKTE.length+' Projekte</span>',
            '<span class="chip">'+nPA+' Projektaufgaben</span>',
            '<span class="chip">'+inArbeit.length+' in Arbeit</span>',
            leerChip(nEingeklappt) ],
    spalten, eingeklappt,
    zaehler: p => je(p.id, w=>["open","in_progress","haengt","umgesetzt"].indexOf(w._station)>=0).length,
    inhalt: p => projektKarteHtml(p, rows.filter(w=>w._projekt===p.id)) +
                 projektPunkteAbnahmeHtml(p, punkteJe(p.id, a=>a.status==="ready_for_verification")) +
                 projektAufgabenHtml(p) +
                 aufgabenSpalteHtml(p, rows.filter(w=>w._projekt===p.id))
  });

  ralphBlockZeichnen(rows);

  $("tafel").innerHTML = html;

  $("fussnote").innerHTML =
    '<b>Woher die Zahlen kommen:</b> Gerüst und Ampel aus <code>cb_admin_agent_projektstruktur</code>, ' +
    'Projektpunkt-Status aus <code>cb_admin_agent_projektaufgaben_kurzliste</code>, ' +
    'Zielzahlen aus <code>cb_admin_agent_projekt_messsicht</code>, ' +
    'Work Items aus <code>cb_admin_agent_work_kurzliste</code>. ' +
    'Diese Seite speichert nichts Eigenes. Geschrieben wird über ' +
    '<code>cb_admin_agent_work_status</code>, <code>_zuweisen</code>, <code>_zuordnen</code> sowie ' +
    '<code>cb_admin_agent_projektaufgabe_melden</code> und <code>_verifizieren</code>. ' +
    '<b>Der Abnahmeweg (E32/E34):</b> Work Items umgesetzt melden → ganzen Projektpunkt melden → ' +
    'durch einen anderen Agenten oder Ralph abnehmen. Die Datenbank weist Selbstabnahme ab.';

  verdrahten();
}

/* ---------- Entscheidungen bei Ralph · über der Tafel (E34) ---------- */
function ralphBlockZeichnen(rows){
  const el = $("ralphblock");
  const entscheiden = rows.filter(w=>w._station==="entscheid_e0");
  /* Projektpunkte, die fertig gemeldet sind, stehen hier mit — Ralph schliesst
     ab (E34: „zum Schluss Abnahme durch mich"). Abnehmen darf jeder ausser dem
     Erbauer; der Server weist Selbstabnahme ab, die Seite prueft das nicht nach. */
  const punkte = [];
  for(const p of PROJEKTE) for(const a of (PAUFGABEN[p.id]||[]))
    if(a.status==="ready_for_verification") punkte.push({p,a});
  const alle = entscheiden.length + punkte.length;
  /* Die Karte „Neue Aufgabe" steht immer — auch wenn nichts zu entscheiden ist.
     Vorher verschwand der ganze Block bei 0, und Ralph hatte keinen Einstieg. */
  /* Ralph, 05.09.: „ich bin nicht sicher, dass die Aufgaben sauber angeschlossen sind."
     Drei Zahlen, jede Sitzung neu gemessen: Aufgaben ohne Punkt (unsichtbar),
     Punkte ohne Aufgabe (niemand arbeitet daran), Punkte, die fertig sind, aber nicht gemeldet. */
  const ohnePunkt = rows.filter(w => !WORK_AUFGABE[w.work_id] && ["verified","cancelled"].indexOf(w.status)<0).length;
  let punkteLeer = 0, punkteMeldbar = 0;
  for(const p of PROJEKTE) for(const a of (PAUFGABEN[p.id]||[])){
    if(a.status==="verified") continue;
    const items = ZEILEN.filter(w => WORK_AUFGABE[w.work_id]===a.aufgabe_id);
    const offen = items.filter(w => ["open","in_progress","blocked","disputed","decision_ralph"].indexOf(w.status)>=0);
    const fertig = items.filter(w => w.status==="ready_for_verification");
    if(!items.length) punkteLeer++;
    else if(!offen.length && fertig.length && a.status!=="ready_for_verification") punkteMeldbar++;
  }
  const anschluss =
    '<div class="rb-zeile rb-punkt" style="cursor:default">' +
      '<span class="rid">Anschluss</span>' +
      '<span class="rt">'+ohnePunkt+' Aufgaben ohne Punkt · '+punkteLeer+' Punkte ohne Aufgabe · '+punkteMeldbar+' Punkte fertig, nicht gemeldet</span>' +
      '<span class="rw">'+(ohnePunkt+punkteMeldbar===0 ? "sauber angeschlossen" : "bitte ansehen")+'</span>' +
    '</div>';
  const neuKarte =
    '<div class="rb-zeile rb-neu" id="rbNeu">' +
      '<span class="rid">+ Neue Aufgabe</span>' +
      '<span class="rt">Aufgabe anlegen und einem Projektpunkt zuordnen</span>' +
      '<span class="rw">geht über cb_admin_agent_work_setzen</span>' +
    '</div>';
  const punktZeile = ({p,a}) =>
    '<div class="rb-zeile rb-punkt">' +
      '<span class="rid">'+esc((p.kuerzel&&a.nummer)?p.kuerzel+"-"+a.nummer:a.aufgabe_id)+'</span>' +
      '<span class="rt">'+esc(a.titel||a.aufgabe_id)+'</span>' +
      '<span class="rw">abnehmen · gemeldet von '+esc(a.owner_agent||"—")+' · '+alterText(a.updated_at)+'</span>' +
      '<button data-punkt-action="verify" data-punkt="'+esc(a.aufgabe_id)+'">abnehmen</button>' +
      '<button data-punkt-action="reject" data-punkt="'+esc(a.aufgabe_id)+'">zurück</button>' +
    '</div>';
  const zeile = (w, was) =>
    '<div class="rb-zeile" data-work="'+w.work_id+'">' +
      '<span class="rid">'+esc(w._nummer)+'</span>' +
      '<span class="rt">'+esc(einSatz(w.title))+'</span>' +
      '<span class="rw">'+esc(was)+' · '+esc(projektVon(w._projekt)?projektVon(w._projekt).kuerzel||"—":"—")+
      ' · '+alterText(w.updated_at)+'</span>' +
    '</div>';
  el.style.display = "";
  el.innerHTML =
    '<div class="rb-kopf"><h2>Bei dir, Ralph · '+alle+'</h2>' +
      '<span class="regel">'+entscheiden.length+' zu entscheiden · '+punkte.length+' Projektpunkte abzunehmen. ' +
      'Zeile anklicken öffnet die Aufgabe.</span></div>' +
    '<div class="rb-liste">' +
      neuKarte + anschluss +
      entscheiden.map(w=>zeile(w,"entscheiden")).join("") +
      punkte.map(punktZeile).join("") +
    '</div>';
  const nk = $("rbNeu"); if(nk) nk.addEventListener("click", neuPanelAuf);
}

/* ---------- Neue Aufgabe anlegen (Ralph, 03.09.) ---------- */
function neuPanelAuf(){
  $("nTitel").value = "";
  $("nMeldung").textContent = ""; $("nMeldung").className = "meldung";
  $("panelNeu").classList.add("auf"); $("abdeckung").classList.add("auf");
  $("nTitel").focus();
}
function neuPanelZu(){
  $("panelNeu").classList.remove("auf");
  if(!$("panel").classList.contains("auf")) $("abdeckung").classList.remove("auf");
}
function neuMelden(t, gut){
  const m = $("nMeldung"); m.textContent = t; m.className = "meldung " + (gut ? "gut" : "schlecht");
  const k = document.querySelector("#panelNeu .panel-koerper"); if(k) k.scrollTop = 0;
}
async function neuAnlegen(){
  const actor = $("actor").value;
  const titel = $("nTitel").value.trim();
  if(!titel) return neuMelden("Ohne Überschrift keine Aufgabe.", false);
  $("nAnlegen").disabled = true;
  try{
    /* Nur die Ueberschrift. Die Rubriken sind Pflicht in der Datenbank - sie
       stehen sichtbar als „noch nicht eingetragen", nicht erfunden. */
    const r = await client.rpc("cb_admin_agent_work_setzen", {
      p_actor: actor, p_owner: "ralph", p_area: "projektsteuerung",
      p_title: titel, p_description: "Noch nicht eingetragen.", p_acceptance_criteria: "Noch nicht festgelegt.",
      p_product_id: null, p_priority: 50, p_dependency_work_id: null, p_decision_needed: false,
      p_evidence: { angelegt_ueber: "steuerung.html", von: actor },
      p_projekt_aufgabe_id: EINGANG_PUNKT, p_warum: null });
    if(r.error) throw r.error;
    neuMelden("Angelegt als #"+r.data+" in RA-1 Eingang. Zuordnen geht im Panel.", true);
    $("nTitel").value = "";
    await laden();
    setTimeout(neuPanelZu, 700);
  }catch(e){
    neuMelden((e && e.message) || String(e), false);
  }finally{
    $("nAnlegen").disabled = false;
  }
}
/* Der Sammelpunkt fuer Ralphs Ueberschriften (Ralph, 03.09.) */
const EINGANG_PUNKT = "eingang-1";

/* Ein Satz reicht Ralph zum Entscheiden. Gekuerzt wird an der Satzgrenze, nicht
   mitten im Wort — und nur, wenn der Titel wirklich mehrere Saetze hat. */
function einSatz(t){
  const s = String(t||"").trim();
  const i = s.search(/[.!?]\s/);
  return (i > 0 && i < s.length-2) ? s.slice(0, i+1) : s;
}

/* ---------- Eine Zeile der Tafel · gleiche Spalten in jeder Zeile ---------- */
function ebeneZeile(o){
  let h = '<div class="stock" style="--akzent:'+o.akzent+'">' +
    '<div class="stock-kopf"><span class="punkt"></span><h2>'+esc(o.titel)+'</h2>' +
    o.chips.join("") +
    '<span class="regel">'+esc(o.regel)+'</span></div>' +
    '<div class="stock-koerper" style="'+o.spalten+'">';
  for(const p of PROJEKTE){
    /* Eingeklappt: die Spalte bleibt stehen, der Inhalt wird nicht gezeichnet.
       Das Projekt verschwindet nicht — es nimmt nur keinen Platz mehr weg. */
    if(o.eingeklappt && o.eingeklappt(p)){
      h += '<div class="spalte schmal" data-aufklappen="'+esc(p.id)+'" ' +
        'title="'+esc(p.name+" — keine offene Aufgabe. Klicken klappt auf.")+'">' +
        '<span class="kz-hoch">'+esc(p.kuerzel||"—")+'</span></div>';
      continue;
    }
    h += '<div class="spalte">' +
      '<div class="spalte-kopf"><span class="kz">'+esc(p.kuerzel||"—")+'</span>' +
      '<span class="name">'+esc(p.name)+'</span>' +
      '<span class="n">'+(o.zaehler ? o.zaehler(p) : "")+'</span></div>' +
      o.inhalt(p) + '</div>';
  }
  return h + '</div></div>';
}
/* Wie viele Projekte gerade eingeklappt sind. Klick klappt alle wieder auf —
   damit niemand ein Projekt fuer geloescht haelt, das nur schmal ist. */
function leerChip(n){
  if(!n) return '';
  return '<span class="chip" id="chipLeer" style="cursor:pointer;border-style:dashed" ' +
    'title="Alle wieder aufklappen">'+n+' ohne offene Aufgabe · eingeklappt</span>';
}
function zaehlChip(rows, f, name){
  const n = rows.filter(f).length;
  return '<span class="chip"'+(n?' style="border-color:var(--abnahme);color:var(--abnahme)"':'')+'>'+
    n+' '+esc(name)+'</span>';
}

/* Ein Stapel Karten in einer Zeile der Tafel. Ablegen ist erlaubt, damit der
   Server die Entscheidung treffen kann — abgewiesen wird in abgelegt(). */
function stapelHtml(p, station, karten, leerText){
  const s = STATIONEN.find(x=>x.id===station) || STATIONEN[0];
  const stapel = karten.slice().sort((a,b)=> (b.priority||0)-(a.priority||0) || (b.work_id-a.work_id));
  return '<div class="stapel" data-ziel="'+esc(station)+'" data-projekt="'+esc(p.id)+'">' +
    (stapel.length ? stapel.map(w=>karteHtml(w, STATIONEN.find(x=>x.id===w._station) || s)).join("")
                   : '<div class="leer">'+esc(leerText||"—")+'</div>') +
    '</div>';
}

/* ---------- Projektkarte · Zweck, Ziel, Zahlen ---------- */
function projektKarteHtml(p, rows){
  const n = s => rows.filter(w=>w._station===s).length;
  const laeuft = n("in_progress");
  const umgesetzt = n("umgesetzt");
  const m = MESSWERTE[p.id];
  /* Die Zielzahl steht oben neben dem Titel und ist nach Fortschritt hinterlegt
     (Ralph, 02.09.). Darunter bleibt nur noch, WAS gemessen wird. */
  const messHtml = m
    ? '<div class="ziel"><b>'+esc(m.messung)+'</b></div>'
    : '<div class="ziel"><b>Zielzahl</b><span class="leerfeld">für dieses Projekt noch nicht festgelegt</span></div>';
  const aeltester = rows.filter(w=>w._station==="haengt" || w.status==="ready_for_verification")
    .sort((a,b)=>tage(b.updated_at)-tage(a.updated_at))[0];
  return '<div class="pkarte" style="--pf:'+
      (laeuft ? "var(--laeuft)" : "var(--linie)")+'">' +
    '<div class="kopfz"><span class="kz">'+esc(p.kuerzel||"—")+'</span><h3>'+esc(p.name)+'</h3>' +
      zielBadge(m) + '</div>' +
    '<div class="lauf">'+(laeuft ? "läuft gerade" : "steht an")+' · '+rows.length+' Aufgaben · '+esc(p.status||"—")+'</div>' +
    (p.beschreibung ? '<div class="was">'+esc(p.beschreibung)+'</div>' : '') +
    messHtml +
    '<div class="zahlen">' +
      zbox(n("open"),"offen","var(--offen)") +
      zbox(laeuft,"läuft","var(--laeuft)") +
      zbox(umgesetzt,"umgesetzt","var(--abnahme)") +
      zbox(n("haengt"),"hängt","var(--haengt)") +
    '</div>' +
    (aeltester ? '<div class="wartet">ältester Wartefall <b>'+esc(aeltester._nummer)+'</b> · '+
      alterText(aeltester.updated_at)+'</div>' : '') +
    '</div>';
}

/* ---------- Die Zielzahl als farbiger Balken neben dem Titel ----------
   Ralph, 02.09.: „die zielzahl soll oben neben dem titel stehen und farblich
   hinterlegt sein, als farbscala."

   Die Farbe ist ANZEIGE, kein Fachurteil. Ob ein Ziel erreicht ist, sagt das
   Serverfeld `erfuellt` — das wird gelesen, nicht nachgerechnet (CLAUDE.md B1).
   Gerechnet wird allein, WIE WEIT der Balken laeuft:

     Ziel groesser 0  → Anteil heute/Ziel, gekappt auf 0 bis 1. Beispiel:
                        drei Viertel des Ziels sind drei Viertel des Balkens.
     Ziel gleich 0    → „weniger ist besser", z. B. Luecken auf null. Ohne
                        Startwert gibt es hier keinen Zwischenstand: entweder
                        erfuellt oder nicht. Es wird nichts erfunden (A2). */
function zielAnteil(m){
  if(!m) return null;
  if(m.erfuellt) return 1;
  const heute = Number(m.heute_wert), ziel = Number(m.ziel_wert);
  if(!isFinite(heute) || !isFinite(ziel)) return null;
  if(ziel > 0) return Math.max(0, Math.min(1, heute / ziel));
  return 0;
}

/* Rot (0°) über Gelb (45°) nach Grün (130°). Ein durchgehender Verlauf, damit
   84 Prozent sichtbar anders aussehen als 40 — eine Ampel mit drei Stufen
   wuerde genau diesen Unterschied verschlucken. */
function zielFarbe(a){
  if(a===null) return null;
  const ton = Math.round(a * 130);
  return { grund:"hsl("+ton+" 55% 22%)", rand:"hsl("+ton+" 60% 40%)",
           schrift:"hsl("+ton+" 70% 78%)" };
}

function zielBadge(m){
  if(!m) return '';
  const a = zielAnteil(m), f = zielFarbe(a);
  if(!f) return '';
  return '<span class="zielbadge" title="'+esc(m.messung)+'" ' +
    'style="background:'+f.grund+';border-color:'+f.rand+';color:'+f.schrift+'">' +
    '<b>'+esc(messwertText(m.heute_wert, m.einheit))+'</b>' +
    '<i>von '+esc(messwertText(m.ziel_wert, m.einheit))+'</i>' +
    '<span class="zielbalken"><span style="width:'+Math.round(a*100)+'%;background:'+f.rand+'"></span></span>' +
    '</span>';
}

function messwertText(wert, einheit){
  const n = Number(wert);
  const zahl = Number.isFinite(n) ? n.toLocaleString("de-DE", {maximumFractionDigits:1}) : "—";
  return zahl + (einheit==="%" ? " %" : " "+esc(einheit||""));
}

function zbox(n,name,farbe){
  return '<div class="zbox"><b style="color:'+(n?farbe:"var(--schwach)")+'">'+n+'</b><span>'+esc(name)+'</span></div>';
}

/* ---------- Projektaufgaben mit Ampel ---------- */
const AMPEL_FARBE = { gruen:"var(--fertig)", gelb:"var(--abnahme)", rot:"var(--haengt)" };
/* Jede Projektaufgabe traegt ihre Kuerzel-Nummer (KP-3, nicht scanweg-r3) und
   laesst sich aufklappen: Zweck, Fertig-Kriterium und die Work Items darunter,
   je mit Nummer und Station (#396). Alles gelesen, nichts nachgerechnet. */
/* ---------- Die Kette (#412, Ralph 02.09.) ----------
   „Ich sehe nicht auf einen Blick, wie die Reihenfolge sein muss."
   Punkte mit Zahl als Nummer (1, 2, 3 …) bilden die KETTE: nacheinander, von
   oben nach unten, mit Verbindungslinie. Punkte mit Buchstabe (B, V …) sind
   DAUERSTRAENGE: laufen nebenher, blockieren nichts. Der Marker ▶ steht am
   ersten Kettenpunkt, der noch nicht abgenommen ist — das ist keine
   Serverentscheidung, sondern die Definition von Reihenfolge. Alles danach
   heisst „wartet auf N". Ampelfarbe bleibt aus dem Server; gezaehlt wird nur. */
function istKette(a){ return /^\d+$/.test(String(a.nummer||"")); }

function projektAufgabenHtml(p){
  let h = "";
  const alle = (PAUFGABEN[p.id] || []).slice()
    .sort((x,y)=> (Number(x.reihenfolge)||99)-(Number(y.reihenfolge)||99) ||
                  String(x.nummer).localeCompare(String(y.nummer),"de",{numeric:true}));
  if(!alle.length) return '<div class="leer">keine Projektaufgabe</div>';
  const kette = alle.filter(istKette), dauer = alle.filter(a=>!istKette(a));
  const naechster = kette.find(a=>a.status!=="verified");
  const naechsterIdx = naechster ? kette.indexOf(naechster) : -1;

  if(kette.length) h += '<div class="kette-kopf">Kette · nacheinander</div><div class="kette">';
  kette.forEach((a,i)=>{
    const wartet = (naechsterIdx>=0 && i>naechsterIdx) ? kette[i-1] : null;
    h += punktZeileHtml(p, a, { hier: a===naechster, wartetAuf: wartet, kette:true, letzter: i===kette.length-1 });
  });
  if(kette.length) h += '</div>';
  if(dauer.length){
    h += '<div class="kette-kopf">Dauerstränge · nebenher</div>';
    for(const a of dauer) h += punktZeileHtml(p, a, { hier:false, wartetAuf:null, kette:false, letzter:true });
  }
  return h;
}

function punktZeileHtml(p, a, k){
  let h = "";
  const items = ZEILEN.filter(w=>WORK_AUFGABE[w.work_id]===a.aufgabe_id)
    .sort((x,y)=> (STOPP_RANG[x.status]-STOPP_RANG[y.status]) || (y.priority||0)-(x.priority||0));
  const key = "pa|"+a.aufgabe_id;
  const auf = !!OFFEN_STAPEL[key];
  const nr = (p.kuerzel && a.nummer) ? (p.kuerzel+"-"+a.nummer) : a.aufgabe_id;
  const nGemeldet = items.filter(w=>w.status==="ready_for_verification").length;
  const nOffen = items.length - nGemeldet;
  let stand;
  if(a.status==="verified") stand = "abgenommen";
  else if(a.status==="ready_for_verification") stand = "Punkt gemeldet";
  else if(k.wartetAuf) stand = "wartet auf "+esc((p.kuerzel&&k.wartetAuf.nummer)?p.kuerzel+"-"+k.wartetAuf.nummer:k.wartetAuf.aufgabe_id);
  else if(!items.length) stand = "keine Aufgabe";
  else stand = (nGemeldet?nGemeldet+" gemeldet":"") + (nGemeldet&&nOffen?" · ":"") + (nOffen?nOffen+" offen":"");

  h += '<div class="paufgabe'+(auf?" auf":"")+(k.hier?" hier":"")+(k.kette?" inkette":"")+(k.letzter?" letzter":"")+
      '" data-pa="'+esc(key)+'">' +
    '<span class="ampel" style="background:'+(AMPEL_FARBE[a.ampel]||"var(--linie)")+'"></span>' +
    '<span class="panr">'+esc(nr)+'</span>' +

    '<span class="pa-stand'+(k.hier?" hier":"")+'">'+(k.hier?"▶ hier · ":"")+stand+'</span>' +
    '<span class="pfeil">'+(auf?"▲":"▼")+'</span></div>';

  if(auf){
    /* Zweck und Fertig-Kriterium je Punkt liefert der Server heute nicht
       (#395 ist eingefaltet, E34). Fehlen beide, steht das in EINER Zeile —
       nicht zwei leere Felder mit Verweis auf eine stillgelegte Aufgabe. */
    const zf = (a.zweck ? '<div class="pa-feld"><b>Zweck</b>'+esc(a.zweck)+'</div>' : '') +
               (a.fertig_kriterium ? '<div class="pa-feld"><b>Fertig, wenn</b>'+esc(a.fertig_kriterium)+'</div>' : '');
    h += '<div class="pa-auf">' +
      (zf || '<div class="pa-feld"><i class="fehlt">Zweck und Fertig-Kriterium dieses Punkts: steht noch nicht im Server — die Aufgaben darunter tragen sie.</i></div>') +
      '<div class="pa-feld"><b>Aufgaben darunter</b>' +
      (items.length
        ? '<div class="pa-items">' + items.map(w=>{
            const s = STATIONEN.find(x=>x.id===w._station);
            return '<div class="pa-item" data-work="'+w.work_id+'">' +
              '<span class="ampel" style="background:'+(s?s.farbe:"var(--linie)")+'"></span>' +
              '<span class="pinr">'+esc(w._nummer)+'</span>' +
              '<span class="pit">'+esc(w.title||"")+'</span>' +
              '<span class="pis">'+esc(s?s.name:w.status)+'</span></div>';
          }).join("") + '</div>'
        : '<i class="fehlt">keine</i>') +
      '</div>' +
      (a.verification_note ? '<div class="pa-feld"><b>Letzte Prüfung</b>'+esc(a.verification_note)+'</div>' : '') +
      projektPunktAktionenHtml(a,items) +

  }
  return h;
}
