/* ============================================================
   6 · Buendel abholen — die sechs Regeln aus #375
   ============================================================ */
function buendelFuer(pid, rows){
  const actor = $("actor").value;
  /* 3. Keine Aufgabe, deren Abhaengigkeit noch nicht abgenommen ist.
        Abgenommenes wird gar nicht geladen — steht die Abhaengigkeit noch in
        der Liste, ist sie also NICHT abgenommen. */
  const aktiv = new Set(ZEILEN.map(w=>w.work_id));
  const kandidaten = rows.filter(w =>
    w.status==="open" &&                                   /* 1 */
    (!w.owner_agent || w.owner_agent===actor) &&
    !(w.dependency_work_id && aktiv.has(w.dependency_work_id))  /* 3 */
  ).sort((a,b)=> (b.priority||0)-(a.priority||0) ||
                 (new Date(a.updated_at)-new Date(b.updated_at)));   /* 6 */
  if(!kandidaten.length) return [];
  const thema = kandidaten[0].area;                        /* 2 */
  return kandidaten.filter(w=>w.area===thema).slice(0,5);  /* 5 */
}

async function buendelAbholen(pid){
  const rows = gefiltert().filter(w=>w._projekt===pid);
  const buendel = buendelFuer(pid, rows);
  if(!buendel.length) return;
  const actor = $("actor").value;
  const liste = buendel.map(w=>w._nummer).join(", ");
  if(!confirm("Bündel abholen?\n\n"+liste+"\n\nThema: "+(buendel[0].area||"—")+
              "\nAlle auf läuft, zuständig: "+actor)) return;

  const notiz = "Bündel abgeholt am " + new Date().toLocaleDateString("de-DE") +
                " von " + actor + " · " + buendel.length + " Aufgaben, Thema " +
                (buendel[0].area||"ohne Thema") + ".";
  let ok=0, fehler=[];
  for(const w of buendel){
    try{
      const a = await client.rpc("cb_admin_agent_work_zuweisen",
        { p_work_id:w.work_id, p_actor:actor, p_owner:actor,
          p_priority:null, p_decision_needed:null, p_note:notiz });
      if(a.error) throw a.error;
      const b = await client.rpc("cb_admin_agent_work_status",
        { p_work_id:w.work_id, p_actor:actor, p_status:"in_progress",
          p_note:notiz, p_evidence:null });
      if(b.error) throw b.error;
      ok++;
    }catch(e){ fehler.push(w._nummer+": "+((e&&e.message)||String(e))); }
  }
  await laden();
  if(fehler.length) alert(ok+" von "+buendel.length+" übernommen.\n\nNicht geklappt:\n"+fehler.join("\n"));
}

/* ============================================================
   7 · Schieben — Station oder Prioritaet, immer ueber die Tuer
   ============================================================ */
let ZIEHT = null;

function verdrahten(){
  /* #613: Der Kartenfilter lässt sich auch im Zählerband wieder abwerfen. */
  const kfw = $("kfWeg");
  if(kfw) kfw.addEventListener("click", ()=>{
    KARTE_FILTER = null;
    document.querySelectorAll("#kernFluss .kfWahl").forEach(d=>d.classList.remove("kfWahl"));
    zeichnen();
  });
  document.querySelectorAll(".aufgabe[data-work]").forEach(el=>{
    el.addEventListener("click", ()=>panelAuf(Number(el.dataset.work)));
  });
  document.querySelectorAll(".karte[data-work]").forEach(el=>{
    el.addEventListener("click", e=>{ if(!ZIEHT) panelAuf(Number(el.dataset.work)); });
    el.addEventListener("dragstart", e=>{
      ZIEHT = Number(el.dataset.work); el.classList.add("zieht");
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", String(ZIEHT)); }catch(_){}
    });
    el.addEventListener("dragend", ()=>{ ZIEHT=null; el.classList.remove("zieht"); });
  });
  document.querySelectorAll(".stapel[data-ziel]").forEach(el=>{
    el.addEventListener("dragover", e=>{ e.preventDefault(); el.classList.add("ziel"); });
    el.addEventListener("dragleave", ()=> el.classList.remove("ziel"));
    el.addEventListener("drop", async e=>{
      e.preventDefault(); el.classList.remove("ziel");
      const id = ZIEHT || Number(e.dataTransfer.getData("text/plain"));
      if(id) await abgelegt(id, el);
    });
  });
  document.querySelectorAll("[data-mehr]").forEach(el=>{
    el.addEventListener("click",()=>{
      OFFEN_STAPEL[el.dataset.mehr] = !OFFEN_STAPEL[el.dataset.mehr];
      zeichnen();
    });
  });
  document.querySelectorAll("[data-buendel]").forEach(el=>{
    el.addEventListener("click",()=>buendelAbholen(el.dataset.buendel));
  });
  /* Projektaufgabe auf- und zuklappen (#396) */
  document.querySelectorAll("[data-pa]").forEach(el=>{
    el.addEventListener("click",()=>{
      OFFEN_STAPEL[el.dataset.pa] = !OFFEN_STAPEL[el.dataset.pa];
      zeichnen();
    });
  });
  document.querySelectorAll(".pa-item[data-work]").forEach(el=>{
    el.addEventListener("click", e=>{ e.stopPropagation(); panelAuf(Number(el.dataset.work)); });
  });
  document.querySelectorAll("button[data-punkt-action]").forEach(el=>{
    el.addEventListener("click", e=>{
      e.stopPropagation();
      projektPunktAktion(el.dataset.punkt,el.dataset.punktAction);
    });
  });
  /* Eingeklapptes Projekt aufklappen — und der Chip klappt alle wieder auf */
  document.querySelectorAll("[data-aufklappen]").forEach(el=>{
    el.addEventListener("click",()=>{
      OFFEN_STAPEL["spalte|"+el.dataset.aufklappen] = true;
      zeichnen();
    });
  });
  document.querySelectorAll("#chipLeer").forEach(el=>{
    el.addEventListener("click",()=>{
      for(const p of PROJEKTE) OFFEN_STAPEL["spalte|"+p.id] = true;
      zeichnen();
    });
  });
  /* Der Ralph-Block ueber der Tafel (E34) */
  document.querySelectorAll(".rb-zeile[data-work]").forEach(el=>{
    el.addEventListener("click", ()=> panelAuf(Number(el.dataset.work)));
  });
}

async function abgelegt(id, ziel){
  const w = ZEILEN.find(x=>x.work_id===id); if(!w) return;
  const actor = $("actor").value;
  const zielStation = ziel.dataset.ziel;
  const zielProjekt = ziel.dataset.projekt;

  if(zielProjekt !== w._projekt){
    alert("Das Projekt wird nicht durch Schieben geändert. Das steht im Panel unter Projektaufgabe.");
    return;
  }
  if(zielStation === w._station) return prioSchieben(w, ziel, actor);

  /* Andere Station: Status setzen. „hängt" ist eine Sammelspalte — der Server
     kennt drei Werte dahinter, also wird gefragt statt geraten. */
  let neuerStatus = zielStation==="umgesetzt" ? "ready_for_verification" : zielStation;
  if(zielStation === "haengt"){
    const w2 = prompt("Warum hängt "+w._nummer+"?\n\n1 = blockiert\n2 = strittig\n3 = Ralph entscheidet","1");
    if(w2===null) return;
    neuerStatus = {"1":"blocked","2":"disputed","3":"decision_ralph"}[w2.trim()];
    if(!neuerStatus){ alert("Nur 1, 2 oder 3."); return; }
  }
  const notiz = prompt("Ohne Notiz kein Stationswechsel. Was wurde gemessen?","");
  if(notiz===null) return;
  if(!notiz.trim()){ alert("Die Notiz darf nicht leer sein."); return; }
  await schreiben(async ()=>{
    const r = await client.rpc("cb_admin_agent_work_status",
      { p_work_id:id, p_actor:actor, p_status:neuerStatus,
        p_note:notiz.trim(), p_evidence:null });
    if(r.error) throw r.error;
  });
}

async function projektPunktAktion(aufgabeId,aktion){
  const actor = $("actor").value;
  /* Ralph, 03.09.: „wenn ich erledigt klicke, dann ist der abgenommen und ich
     muss auch nicht begruenden." Die Messung hat der Agent bei der Meldung
     geliefert; Ralphs Klick ist die Entscheidung. Der Server verlangt eine
     Notiz - sie sagt dann nur, wer wann geklickt hat. Zurueckweisen fragt
     weiter, denn ohne „was fehlt" kann niemand nachbessern. */
  let notiz;
  if(actor==="ralph" && aktion==="verify"){
    notiz = "Abgenommen von Ralph auf der Steuerungsseite, " +
      new Date().toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) + ".";
  } else {
    const frage = aktion==="report"
      ? "Welche Messung belegt, dass alle Aufgaben dieses Punkts umgesetzt sind?"
      : aktion==="reject" ? "Was fehlt? Ein Satz reicht."
      : "Stelle, Gegenfall und Messung für den ganzen Projektpunkt:";
    notiz = prompt(frage,"");
    if(notiz===null) return;
    if(!notiz.trim()) return alert("Ohne Messung keine Bündelmeldung oder Abnahme.");
  }
  await schreiben(async ()=>{
    const r = aktion==="report"
      ? await client.rpc("cb_admin_agent_projektaufgabe_melden",{
          p_aufgabe_id:aufgabeId,p_actor:actor,p_note:notiz.trim(),p_evidence:null })
      : await client.rpc("cb_admin_agent_projektaufgabe_verifizieren",{
          p_aufgabe_id:aufgabeId,p_verifier:actor,p_ok:aktion==="verify",
          p_note:notiz.trim(),p_evidence:null });
    if(r.error) throw r.error;
  });
}

async function prioSchieben(w, ziel, actor){
  const nachbarn = [...ziel.querySelectorAll(".karte[data-work]")]
    .map(el=>ZEILEN.find(x=>x.work_id===Number(el.dataset.work)))
    .filter(x=>x && x.work_id!==w.work_id);
  if(!nachbarn.length) return;
  const neu = prompt("Neue Priorität für "+w._nummer+" (1–100).\n\nIn dieser Station liegen: " +
    nachbarn.map(x=>x._nummer+"="+(x.priority==null?"—":x.priority)).join(", "),
    String(w.priority==null?50:w.priority));
  if(neu===null) return;
  const p = Number(neu);
  if(isNaN(p)||p<1||p>100){ alert("Der Server nimmt nur 1 bis 100."); return; }
  await schreiben(async ()=>{
    const r = await client.rpc("cb_admin_agent_work_zuweisen",
      { p_work_id:w.work_id, p_actor:actor, p_owner:null, p_priority:p,
        p_decision_needed:null,
        p_note:"Priorität auf der Steuerungsseite auf "+p+" geschoben." });
    if(r.error) throw r.error;
  });
}

async function schreiben(fn){
  try{ await fn(); await laden(); }
  catch(e){ alert((e && e.message) || String(e)); }
}

/* ============================================================
   8 · Panel — hier schreiben Ralph und die Projektchats
   ============================================================ */
function panelAuf(id){
  const w = ZEILEN.find(x=>x.work_id===id); if(!w) return;
  AKTUELL = w;
  const p = projektVon(w._projekt);
  $("pId").textContent = w._nummer + " · " + (p ? p.name : "ohne Projekt") + " · " + (w.area||"ohne Thema");
  $("pTitel").textContent = w.title||"";
  $("pStatus").value = w.status;
  $("pOwner").value = "";
  $("pPrio").value = "";
  $("pPrio").placeholder = "unverändert (jetzt "+(w.priority==null?"—":w.priority)+")";
  $("pZuordnung").value = "";
  $("pNotiz").value = "";
  $("pMeldung").className = "meldung";
  $("pTexte").classList.remove("auf");

  /* Ralph, 05.09.: „Was fehlt: Abnahme - was heisst das, was muss ich tun?"
     Die Karte sagt jetzt, WER als naechstes WAS tut - und wenn es ein Klick ist,
     steht der Knopf direkt hier. Berechnet aus Status, Zustaendigem und den
     Geschwistern im Projektpunkt; keine Fachlogik, nur Anzeige des Serverstands. */
  schrittZeichnen(w);

  $("pMeta").innerHTML = "Zuständig <b>"+esc(w.owner_agent||"—")+"</b> · zuletzt bewegt "+
    alterText(w.updated_at) + (w.dependency_work_id ? " · hängt an "+esc(nummerVon(w.dependency_work_id)) : "") +
    (WORK_AUFGABE[w.work_id] ? " · Projektaufgabe "+esc(aufgabeNummerVon(WORK_AUFGABE[w.work_id])) : " · <b>ohne Projektaufgabe</b>") +
    (w.hat_notiz ? " · Notiz vorhanden" : "");

  const kannAbnehmen = w.status==="ready_for_verification" && !WORK_AUFGABE[w.work_id];
  $("pAbnehmen").style.display = kannAbnehmen ? "" : "none";
  if(kannAbnehmen){
    $("pAbnehmen").textContent = "Alte Einzelaufgabe abnehmen";
  }
  $("panel").classList.add("auf"); $("abdeckung").classList.add("auf");
  textNachladen(w.work_id);
}

function punktVonId(aufgabeId){
  for(const p of PROJEKTE) for(const a of (PAUFGABEN[p.id]||[])) if(a.aufgabe_id===aufgabeId) return {p,a};
  return null;
}
function schrittZeichnen(w){
  const el = $("pWeg"); el.style.display = ""; el.className = "schritt";
  const actor = $("actor").value;
  const ich = actor==="ralph" ? "Du" : actor;
  const owner = w.owner_agent || "—";
  const paId = WORK_AUFGABE[w.work_id];
  const pk = paId ? punktVonId(paId) : null;
  const paNr = pk ? (pk.p.kuerzel+"-"+(pk.a.nummer||"")) : "";
  let wer = owner, was = "", knopf = "", ruhig = false;

  if(w.status==="decision_ralph"){
    wer = "Ralph"; was = "Entscheiden. Der Vorschlag mit A / B steht unter „Was fehlt”. Antwort im Chat oder hier: Station auf „offen” setzen und die Wahl in die Notiz.";
  } else if(w.status==="blocked"){
    was = "Blockiert. Der Grund steht unter „Was fehlt”. Wer den Blocker loest, steht dort - sonst "+owner+".";
  } else if(w.status==="disputed"){
    wer = "Ralph"; was = "Strittig zwischen den Agenten. Ralph entscheidet, dann Station auf „offen”.";
  } else if(w.status==="open"){
    was = owner+" faengt an. Noch nichts gemessen."; ruhig = true;
  } else if(w.status==="in_progress"){
    was = owner+" baut. Der letzte Stand steht unter „Was fehlt”."; ruhig = true;
  } else if(w.status==="ready_for_verification"){
    if(!pk){
      wer = "Ralph"; was = "Alte Einzelaufgabe ohne Projektpunkt - unten „Alte Einzelaufgabe abnehmen”.";
    } else {
      const offen = ZEILEN.filter(z => WORK_AUFGABE[z.work_id]===paId && z.work_id!==w.work_id
                                  && ["open","in_progress","blocked","disputed","decision_ralph"].indexOf(z.status)>=0);
      if(offen.length){
        wer = "noch niemand";
        was = "Diese Aufgabe ist fertig. Der Punkt "+paNr+" wird als Ganzes abgenommen, und dort fehlen noch: " +
              offen.map(z => z._nummer+" ("+stationName(z.status)+", "+(z.owner_agent||"—")+")").join(", ") + ".";
      } else if(pk.a.status==="ready_for_verification"){
        wer = actor==="ralph" ? "Du" : "Ralph oder ein anderer Agent als der Erbauer";
        was = "Punkt "+paNr+" abnehmen - ein Klick, keine Begruendung noetig.";
        knopf = '<button data-schritt="verify" data-punkt="'+esc(paId)+'">Punkt '+esc(paNr)+' jetzt abnehmen</button>';
      } else {
        wer = pk.a.owner_agent || owner;
        was = "Alle Aufgaben im Punkt "+paNr+" sind fertig. Der Punkt muss noch als Ganzes gemeldet werden - ein Klick.";
        knopf = '<button data-schritt="report" data-punkt="'+esc(paId)+'">Punkt '+esc(paNr)+' fertig melden</button>';
      }
    }
  } else if(w.status==="verified"){
    wer = "niemand"; was = "Abgenommen."; ruhig = true;
  }
  if(ruhig) el.className += " ruhig";
  el.innerHTML = '<b>Naechster Schritt</b><span class="wer">'+esc(wer)+'</span><p>'+esc(was)+'</p>'+knopf;
  el.querySelectorAll("[data-schritt]").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true;
    await projektPunktAktion(b.dataset.punkt, b.dataset.schritt);
    panelZu();
  }));
}
function stationName(st){
  return ({open:"offen",in_progress:"laeuft",ready_for_verification:"wartet auf Abnahme",blocked:"blockiert",
           disputed:"strittig",decision_ralph:"Ralph entscheidet",verified:"abgenommen",cancelled:"geschlossen"})[st] || st;
}

/* Die Kurzliste bringt keine Texte mit - die holt cb_admin_agent_work_detail (#397).
   Fehlt ein Feld, steht das da. Erfunden wird nichts (CLAUDE.md A2). */
async function textNachladen(id){
  $("pText").innerHTML = '<div class="laedt">Text wird geholt …</div>';
  let d = null, fehler = null;
  try{
    const r = await client.rpc("cb_admin_agent_work_detail",{ p_work_id:id });
    if(r.error) throw r.error;
    let rows = r.data; if(typeof rows==="string") rows = JSON.parse(rows);
    d = Array.isArray(rows) ? rows[0] : rows;
  }catch(e){ fehler = (e && e.message) || String(e); }

  if(!AKTUELL || AKTUELL.work_id !== id) return;   /* inzwischen andere Karte offen */
  if(fehler){
    $("pText").innerHTML = '<div class="block"><b>Text nicht geladen</b><p>'+esc(fehler)+'</p></div>';
    return;
  }
  if(!d){ $("pText").innerHTML = '<div class="block"><b>Text</b><p class="leerfeld">leer</p></div>'; return; }

  AKTUELL.description = d.description;
  AKTUELL.acceptance_criteria = d.acceptance_criteria;
  AKTUELL.warum = d.warum;

  /* Vier Rubriken, je hoechstens drei Kurzsaetze (Ralph, 03.09.). Was laenger
     ist, steht hinter „+ n weitere" — gekuerzt wird die Anzeige, nie der Text. */
  const rubrik = (klasse,titel,text,leer) => {
    const s = saetze(text);
    if(!s.length) return '<div class="block '+klasse+'"><b>'+esc(titel)+'</b><p><span class="leerfeld">'+esc(leer)+'</span></p></div>';
    const li = s.map((x,i)=>'<li class="'+(i>=3?'rest':'')+'">'+esc(x)+'</li>').join("");
    const mehr = s.length>3 ? '<button class="mehr" data-mehr>+ '+(s.length-3)+' weitere</button>' : '';
    return '<div class="block '+klasse+(s.length>3?' zu':'')+'"><b>'+esc(titel)+'</b><ul>'+li+'</ul>'+mehr+'</div>';
  };

  $("pText").innerHTML =
    '<div class="rubriken">' +
      rubrik("","Worum geht es", d.description, "noch nicht eingetragen") +
      rubrik("warum","Warum ist es nötig", d.warum, "noch nicht eingetragen") +
      rubrik("fertig","Wann ist es erledigt", d.acceptance_criteria, "kein prüfbares Kriterium") +
      rubrik("fehlt","Was fehlt · letzter Stand", d.result_note, "noch keine Messung") +
    '</div>' +
    (nullif(d.verification_note)
      ? rubrik("","Letzte Abnahmenotiz von "+(d.verifier_agent||"—"), d.verification_note, "") : "") +
    '<button class="aendern" id="pTexteAuf">✎ Texte der Rubriken ändern</button>';

  $("pText").querySelectorAll("[data-mehr]").forEach(b => b.addEventListener("click", ev => {
    const bl = ev.target.closest(".block"); bl.classList.toggle("zu");
    ev.target.textContent = bl.classList.contains("zu") ? "+ "+(bl.querySelectorAll("li.rest").length)+" weitere" : "weniger";
  }));
  $("pTexteAuf").addEventListener("click", () => {
    $("tWorum").value = d.description||""; $("tWarum").value = d.warum||""; $("tFertig").value = d.acceptance_criteria||"";
    textZaehler();
    $("pTexte").classList.toggle("auf");
  });
}
function nullif(s){ return s!=null && String(s).trim()!==""; }

/* Text in Kurzsaetze zerlegen: an Satzende oder Zeilenumbruch. Ein Aufzaehlungs-
   punkt am Anfang faellt weg. Nichts wird umformuliert. */
function saetze(t){
  const s = String(t||"").replace(/\r/g,"").trim();
  if(!s) return [];
  return s.split(/(?<=[.!?])\s+(?=[A-ZÄÖÜ0-9„"(])|\n+|\s+[·•]\s+/)
          .map(x => x.replace(/^[\s\-–•·*]+/,"").trim())
          .filter(Boolean);
}
function textZaehler(){
  const z = (id, zid, max) => {
    const n = $(id).value.length; const e = $(zid);
    e.textContent = n+" / "+max; e.className = "zaehler" + (n>=max ? " voll" : "");
  };
  z("tWorum","tWorumZ",600); z("tWarum","tWarumZ",300); z("tFertig","tFertigZ",400);
}
async function texteSpeichern(){
  if(!AKTUELL) return;
  const actor = $("actor").value;
  const worum = $("tWorum").value.trim(), warum = $("tWarum").value.trim(), fertig = $("tFertig").value.trim();
  const geaendert = {
    p_description: worum!==(AKTUELL.description||"") ? worum : null,
    p_warum: warum!==(AKTUELL.warum||"") ? warum : null,
    p_acceptance_criteria: fertig!==(AKTUELL.acceptance_criteria||"") ? fertig : null
  };
  if(geaendert.p_description===null && geaendert.p_warum===null && geaendert.p_acceptance_criteria===null)
    return melden("Nichts geändert.", false);
  $("tSpeichern").disabled = true;
  try{
    const r = await client.rpc("cb_admin_agent_work_text", Object.assign(
      { p_work_id:AKTUELL.work_id, p_actor:actor, p_grund:"Rubriken auf der Karte geändert" }, geaendert));
    if(r.error) throw r.error;
    melden("Texte gespeichert.", true);
    $("pTexte").classList.remove("auf");
    textNachladen(AKTUELL.work_id);
  }catch(e){
    melden((e && e.message) || String(e), false);
  }finally{
    $("tSpeichern").disabled = false;
  }
}

function panelZu(){
  $("panel").classList.remove("auf"); $("abdeckung").classList.remove("auf"); AKTUELL=null;
}

async function eintragen(){
  if(!AKTUELL) return;
  const actor = $("actor").value;
  const notiz = $("pNotiz").value.trim();
  const neuerStatus = $("pStatus").value;
  const neuerOwner = $("pOwner").value;
  const neueZuordnung = $("pZuordnung").value;
  const prioRoh = $("pPrio").value.trim();
  const prio = prioRoh==="" ? null : Number(prioRoh);

  if(neuerStatus!==AKTUELL.status && !notiz){
    return melden("Ohne Notiz kein Stationswechsel. Was wurde gemessen?", false);
  }
  if(prio!==null && (isNaN(prio)||prio<1||prio>100)){
    return melden("Der Server nimmt nur 1 bis 100. Alles darunter wirft er zurück.", false);
  }

  $("pSpeichern").disabled = true;
  try{
    if(neuerOwner || prio!==null){
      const r = await client.rpc("cb_admin_agent_work_zuweisen",
        { p_work_id:AKTUELL.work_id, p_actor:actor,
          p_owner: neuerOwner || null, p_priority: prio,
          p_decision_needed: null, p_note: notiz || null });
      if(r.error) throw r.error;
    }
    if(neueZuordnung){
      const r = await client.rpc("cb_admin_agent_work_zuordnen",
        { p_work_id:AKTUELL.work_id, p_actor:actor,
          p_projekt_aufgabe_id: neueZuordnung, p_note: notiz || null });
      if(r.error) throw r.error;
    }
    if(neuerStatus!==AKTUELL.status || notiz){
      const r = await client.rpc("cb_admin_agent_work_status",
        { p_work_id:AKTUELL.work_id, p_actor:actor, p_status:neuerStatus,
          p_note: notiz || null, p_evidence: null });
      if(r.error) throw r.error;
    }
    melden("Eingetragen. Die Tafel wird neu gemessen.", true);
    await laden();
    setTimeout(panelZu, 500);
  }catch(e){
    melden((e && e.message) || String(e), false);
  }finally{
    $("pSpeichern").disabled = false;
  }
}

/* Nur fuer einen unzugeordneten Altfall. Zugeordnete Items werden nie einzeln
   abgenommen; ihre Schaltflaeche bleibt ausgeblendet. */
async function abnehmen(){
  if(!AKTUELL) return;
  const notiz = $("pNotiz").value.trim();
  if(!notiz) return melden("Eine Abnahme ohne Stelle, Gegenfall und Messung ist eine Meinung.", false);
  const actor = $("actor").value;
  $("pAbnehmen").disabled = true;
  try{
    const r = await client.rpc("cb_admin_agent_work_verifizieren",
      { p_work_id:AKTUELL.work_id, p_verifier:actor, p_ok:true,
        p_note:notiz, p_evidence:null });
    if(r.error) throw r.error;
    melden("Alte Einzelaufgabe abgenommen.", true);
    await laden();
    setTimeout(panelZu, 900);
  }catch(e){
    melden((e && e.message) || String(e), false);
  }finally{
    $("pAbnehmen").disabled = false;
  }
}

/* Was der Server sagt, muss Ralph lesen koennen. Vorher stand die Meldung oben
   im Fenster und war bei langem Text ausserhalb der Sicht - fuer Ralph sah es
   aus, als passiere nichts (#397, Fall #367 am 01.09.). */
function melden(t, gut){
  const m = $("pMeldung");
  m.textContent = t;
  m.className = "meldung " + (gut ? "gut" : "schlecht");
  const k = document.querySelector(".panel-koerper");
  if(k) k.scrollTop = 0;
}

/* ============================================================
   9 · Kleinkram
   ============================================================ */
function esc(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function tage(iso){
  if(!iso) return 0;
  const t = Math.floor((Date.now()-new Date(iso).getTime())/86400000);
  return isNaN(t) ? 0 : t;
}
function alterText(iso){
  const t = tage(iso);
  return t<=0 ? "heute" : (t===1 ? "1 Tag" : t+" Tage");
}

$("btnLaden").addEventListener("click", laden);
$("fThema").addEventListener("change", zeichnen);
$("fOwner").addEventListener("change", zeichnen);
$("fStatus").addEventListener("change", zeichnen);
$("fSuche").addEventListener("input", zeichnen);
$("btnNeu").addEventListener("click", neuPanelAuf);
$("pZu").addEventListener("click", panelZu);
$("abdeckung").addEventListener("click", ()=>{ panelZu(); neuPanelZu(); });
$("pSpeichern").addEventListener("click", eintragen);
$("pAbnehmen").addEventListener("click", abnehmen);
$("nZu").addEventListener("click", neuPanelZu);
$("nAnlegen").addEventListener("click", neuAnlegen);
$("nTitel").addEventListener("keydown", e => { if(e.key==="Enter") neuAnlegen(); });
$("tSpeichern").addEventListener("click", texteSpeichern);
$("tWorum").addEventListener("input", textZaehler);
$("tWarum").addEventListener("input", textZaehler);
$("tFertig").addEventListener("input", textZaehler);
document.addEventListener("keydown", e => { if(e.key==="Escape"){ panelZu(); neuPanelZu(); } });

/* Merken, welcher Actor zuletzt geschrieben hat — spart einen Klick je Sitzung. */
try{
  const a = localStorage.getItem("ri-steuerung-actor");
  if(a) $("actor").value = a;
  $("actor").addEventListener("change", ()=>{
    try{ localStorage.setItem("ri-steuerung-actor", $("actor").value); }catch(_){}
    zeichnen();   /* das Buendel haengt am Actor */
  });
}catch(_){}

laden();
